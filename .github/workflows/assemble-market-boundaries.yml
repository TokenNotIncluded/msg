name: Assemble audited market boundary extraction
on:
  push:
    branches: [build/market-boundaries-168]
    paths:
      - .github/tools/assemble_market_boundaries.py
      - .github/workflows/assemble-market-boundaries.yml
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best' && github.ref == 'refs/heads/build/market-boundaries-168'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Require exact regression source
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_SHA"
          git merge-base --is-ancestor 8692ad6c0056e793bbe7b0efc9f5fd0b08ab89c8 HEAD
          git diff --exit-code 8692ad6c0056e793bbe7b0efc9f5fd0b08ab89c8 -- src tests docs
      - name: Assemble and audit shared functions and unchanged state machines
        run: python .github/tools/assemble_market_boundaries.py
      - name: Commit only audited source and notes
        run: |
          git add src/msg/market src/msg/plugins/orders.py src/msg/plugins/money.py src/msg/plugins/delivery.py src/msg/plugins/store.py docs/MARKET_BOUNDARY_PROGRESS.md
          git diff --cached --check
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected=set(json.loads(Path('/tmp/market-boundary-assembly/audit.json').read_text())['changed_paths'])
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,(actual-expected,expected-actual)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(market): own shared records posting and managed delivery independently of entrypoints'
      - name: Publish only the dedicated build branch without force
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/build/market-boundaries-168 | cut -f1)" = "$INPUT_SHA"
          git push origin HEAD:refs/heads/build/market-boundaries-168
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          Path('/tmp/market-boundary-assembly/source.json').write_text(json.dumps({
              'input':os.environ['INPUT_SHA'],'commit':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'),'dirty':bool(git('status','--porcelain'))},indent=2)+'\n')
          PY
          git archive --format=tar.gz -o /tmp/market-boundary-assembly/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: market-boundary-assembly
          path: /tmp/market-boundary-assembly/
          if-no-files-found: error
