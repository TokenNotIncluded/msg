name: Issue 74 isolated verification
on:
  push:
    branches: [work/issues-74-76-continuation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite: [checkout, market, sharing, effects]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq age
      - run: python -m pip install -e '.[dev]'
      - name: Targeted real-database regression
        run: |
          case "$SUITE" in
            checkout) tests=(tests/test_managed_checkout.py tests/test_delivery_target_regression.py) ;;
            market) tests=(tests/test_orders.py tests/test_delivery.py tests/test_escrow_decisions.py tests/test_order_paths.py tests/test_store_foundation.py tests/test_bounty.py) ;;
            sharing) tests=(tests/test_share_grants.py tests/test_share_grants_v2.py tests/test_share_source_boundaries.py tests/test_share_links.py) ;;
            effects) tests=(tests/test_extensions.py tests/test_webhook_delivery.py tests/test_webhook_domain_events.py tests/test_webhook_identity.py) ;;
            *) exit 2 ;;
          esac
          python -m pytest "${tests[@]}" -q --junitxml="artifacts/$SUITE.xml"
      - name: Archive tracked source only
        if: always()
        run: git archive --format=tar.gz --output=issue-74-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: issue-74-${{ matrix.suite }}
          path: |
            issue-74-source.tar.gz
            artifacts/
          retention-days: 1
