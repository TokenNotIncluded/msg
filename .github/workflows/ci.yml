name: Rewrite contracts
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rewrite-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  shards:
    runs-on: ubuntu-latest
    # The 20-minute budget canceled a progressing PG/tool integration shard at 85%.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    services:
      postgres:
        # Recovery jobs explicitly install matching PostgreSQL 16 client tools.
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9.0.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
      MSG_TEST_LEGACY_SOURCE: ${{ github.workspace }}/.legacy-ledger
    steps:
      - uses: actions/checkout@v7
      - name: Check out the pinned legacy schema for migration tests
        uses: actions/checkout@v7
        with:
          ref: ac083b3666b1b5268d90115129e2cc4e0dd11521
          path: .legacy-ledger
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Install required recovery and ingress test tools
        run: |
          sudo apt-get update -qq
          sudo env NEEDRESTART_MODE=l apt-get install -y -qq postgresql-client-16 age nginx openssl git-lfs bubblewrap apparmor-profiles libpcsclite-dev swig
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          age --version
          nginx -v
          openssl version
          bwrap --version
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Install pinned real age recovery tools
        run: |
          set -euo pipefail
          crypto_tools="$RUNNER_TEMP/msg-crypto-tools"
          mkdir -p "$crypto_tools/bin" "$crypto_tools/source" artifacts
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$crypto_tools/age.tar.gz" \
            https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz
          printf 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10  %s\n' \
            "$crypto_tools/age.tar.gz" | sha256sum --check --strict
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$crypto_tools/age.tar.gz" --directory "$crypto_tools/source"
          install -m 0755 "$crypto_tools/source/age/age" "$crypto_tools/bin/age"
          install -m 0755 "$crypto_tools/source/age/age-keygen" "$crypto_tools/bin/age-keygen"
          # The official 0.5.1 release has no Linux binary. Its published crate
          # includes Cargo.lock and records the same Git commit as the release tag.
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$crypto_tools/age-plugin-yubikey.crate" \
            https://static.crates.io/crates/age-plugin-yubikey/age-plugin-yubikey-0.5.1.crate
          printf 'ba2acef0b201cfe0b3f3c5dcef63495449b3ee9f2c8ad6a32f6530231fbc9209  %s\n' \
            "$crypto_tools/age-plugin-yubikey.crate" | sha256sum --check --strict
          tar --extract --gzip --no-same-owner --no-same-permissions \
            --file "$crypto_tools/age-plugin-yubikey.crate" --directory "$crypto_tools/source"
          python - <<'PY'
          import json, os
          from pathlib import Path
          source = Path(os.environ['RUNNER_TEMP']) / 'msg-crypto-tools/source/age-plugin-yubikey-0.5.1'
          if json.loads((source / '.cargo_vcs_info.json').read_text())['git']['sha1'] != '9329e31dd3d0819d5d7b739aef59e455e10fcfa1':
              raise SystemExit('age-plugin-yubikey source differs from the pinned official tag')
          PY
          cargo install --locked --path "$crypto_tools/source/age-plugin-yubikey-0.5.1" --root "$crypto_tools"
          export PATH="$crypto_tools/bin:$PATH"
          printf '%s\n' "$crypto_tools/bin" >> "$GITHUB_PATH"
          test "$(age --version)" = v1.3.2
          test "$(age-keygen --version)" = v1.3.2
          test "$(age-plugin-yubikey --version)" = 'age-plugin-yubikey 0.5.1'
          python - <<'PY'
          import hashlib, json, os, shutil, subprocess
          from pathlib import Path
          directory = Path(os.environ['RUNNER_TEMP']) / 'msg-crypto-tools'
          tools = {}
          for name in ('age', 'age-keygen', 'age-plugin-yubikey'):
              executable = directory / 'bin' / name
              if shutil.which(name) != str(executable):
                  raise SystemExit(f'{name} is not using the pinned CI installation')
              tools[name] = {'path': str(executable), 'version': subprocess.check_output([str(executable), '--version'], text=True).strip(),
                             'sha256': hashlib.sha256(executable.read_bytes()).hexdigest()}
          report = {'tools': tools, 'cargo': subprocess.check_output(['cargo', '--version'], text=True).strip(),
                    'archives': {name: hashlib.sha256((directory / name).read_bytes()).hexdigest()
                                 for name in ('age.tar.gz', 'age-plugin-yubikey.crate')},
                    'yubikey_source_commit': '9329e31dd3d0819d5d7b739aef59e455e10fcfa1'}
          Path('artifacts/ci-crypto-tools.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Install the complete dependency set
        run: |
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"
          uv pip check
      - name: Install real Chromium for browser acceptance
        run: |
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          from playwright.sync_api import sync_playwright

          with sync_playwright() as tool:
              executable = Path(tool.chromium.executable_path)
          if not executable.is_file() or not os.access(executable, os.X_OK):
              raise SystemExit(f'Chromium executable is unavailable: {executable}')
          subprocess.run([str(executable), '--version'], check=True)
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write(f'MSG_BROWSER_PATH={executable}\n')
          PY
      - name: Check real tool isolation before running shards
        run: python scripts/check_tool_sandbox.py
      - name: Compile all new modules
        run: python -W error -m compileall -q src
      - name: Run core, business and security tests
        run: python scripts/ci_shards.py run ${{ matrix.shard }} 8
      - name: Require every transport and actual tokenizer
        if: matrix.shard == 0
        env:
          MSG_BENCHMARK_PATH: artifacts/token-budget.json
        run: python -m pytest conformance --junitxml=artifacts/conformance.xml
      - name: Build installable artifacts
        if: matrix.shard == 0
        run: |
          python -m build
          python scripts/check_package_artifacts.py dist
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: rewrite-verification-${{ matrix.shard }}
          path: |
            artifacts/
            dist/
  contracts:
    if: always()
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: rewrite-verification-*
          merge-multiple: true
      - name: Require complete disjoint test evidence
        run: python scripts/ci_shards.py check 8
      - name: Require all tests, conformance and build jobs to succeed
        env:
          SHARD_RESULT: ${{ needs.shards.result }}
        run: test "$SHARD_RESULT" = success
