name: Rewrite contracts
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rewrite-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    # The persistent credential crash matrix adds real PostgreSQL/transport cases.
    timeout-minutes: 30
    services:
      postgres:
        # Ubuntu runner provides pg_dump 16; its client must not be older than the server.
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9.0.6
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
      MSG_TEST_LEGACY_SOURCE: ${{ github.workspace }}/.legacy-ledger
    steps:
      - uses: actions/checkout@v7
      - name: Check out the pinned legacy schema for migration tests
        uses: actions/checkout@v7
        with:
          ref: ac083b3666b1b5268d90115129e2cc4e0dd11521
          path: .legacy-ledger
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Install required recovery and ingress test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age nginx openssl
          age --version
          nginx -v
          openssl version
      - name: Install the complete dependency set
        run: python -m pip install -e '.[dev]'
      - name: Compile all new modules
        run: python -m compileall -q src
      - name: Run core, business and security tests
        run: python -m pytest tests --junitxml=artifacts/tests.xml
      - name: Require every transport and actual tokenizer
        env:
          MSG_BENCHMARK_PATH: artifacts/token-budget.json
        run: python -m pytest conformance --junitxml=artifacts/conformance.xml
      - name: Build installable artifacts
        run: python -m build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rewrite-verification
          path: |
            artifacts/
            dist/
