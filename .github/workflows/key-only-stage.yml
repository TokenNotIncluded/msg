name: Key-only identity verification
on:
  push:
    branches: [ci/key-only-identity-20261011]
    paths: [.github/workflows/key-only-stage.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: work
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.0.6
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          path: stage
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 705b44f0f9583a644fbfaf974635be5ca65b4fca
          path: work
          persist-credentials: true
      - name: Apply exact reviewed source deltas
        id: apply
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def apply(stem, parts, checksum):
              encoded = ''.join((Path('../stage/.ci') / f'{stem}.{n}').read_text() for n in parts)
              raw = lzma.decompress(base64.b85decode(encoded))
              assert hashlib.sha256(raw).hexdigest() == checksum
              payload = json.loads(raw)
              assert payload['base'] in {git('rev-parse', 'HEAD'), git('write-tree')}
              for item in payload['changes']:
                  path, source = Path(item['path']), Path(item['source'])
                  assert not path.is_absolute() and '..' not in path.parts and path.parts[0] not in {'.git', '.github'}
                  assert not source.is_absolute() and '..' not in source.parts
                  if item.get('delete'):
                      path.unlink()
                      continue
                  result = subprocess.run(['git', 'show', f"{payload['base']}:{source.as_posix()}"], capture_output=True, text=True)
                  lines = result.stdout.splitlines(keepends=True) if result.returncode == 0 else []
                  for start, end, replacement in reversed(item['edits']):
                      lines[start:end] = [replacement]
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(''.join(lines))
              subprocess.run(['git', 'add', '-A'], check=True)
              assert git('write-tree') == payload['tree']
              print('Verified source tree:', payload['tree'])
          apply('key-only.delta', (1, 2, 3), '9a630fb12bfaf2d72951db713ccb4240d750179828b668716af7af59fa8c5cf1')
          apply('key-only.fix', (1, 2), 'bd238ce0cca672b779c5b6cf3120d7e795fd05a080fc500a4ce16338a34f4af4')
          Path('../artifacts').mkdir(exist_ok=True)
          Path('../artifacts/input-tree.txt').write_text(git('write-tree') + '\n')
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install locked requirements
        run: |
          sudo apt-get update -qq
          sudo env NEEDRESTART_MODE=l apt-get install -y -qq libpcsclite-dev swig age
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
          echo "$GITHUB_WORKSPACE/work/.venv/bin" >> "$GITHUB_PATH"
          uv pip check
      - name: Check code and formatting
        id: quality
        continue-on-error: true
        run: |
          uv run --no-sync ruff check --fix . > ../artifacts/ruff.txt 2>&1
          uv run --no-sync ruff format . >> ../artifacts/ruff.txt 2>&1
          uv run --no-sync python -W error -m compileall -q src > ../artifacts/compile.txt 2>&1
          git diff --check >> ../artifacts/compile.txt 2>&1
      - name: Collect complete suite
        id: collect
        continue-on-error: true
        run: uv run --no-sync python -m pytest --collect-only -q > ../artifacts/collection.txt 2>&1
      - name: Run all changed tests and configuration contracts
        id: tests
        continue-on-error: true
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          paths = subprocess.check_output(['git', 'diff', 'HEAD', '--name-only'], text=True).splitlines()
          tests = {p for p in paths if p.startswith('tests/test_') and p.endswith('.py') and Path(p).is_file()}
          tests.update(['tests/test_config_safety.py', 'tests/test_configuration_field_contracts.py', 'tests/test_pg_config.py'])
          Path('../artifacts/targets.txt').write_text('\n'.join(sorted(tests)))
          PY
          mapfile -t targets < ../artifacts/targets.txt
          set -o pipefail
          uv run --no-sync python -m pytest "${targets[@]}" --maxfail=15 --junitxml=../artifacts/key-identity.xml 2>&1 | tee ../artifacts/tests.txt
      - name: Run client JavaScript contracts
        id: javascript
        continue-on-error: true
        run: node --test tests/js/*.test.cjs > ../artifacts/javascript.txt 2>&1
      - name: Build distribution
        id: build
        continue-on-error: true
        run: uv build --no-sources > ../artifacts/build.txt 2>&1
      - name: Preserve source and evidence
        if: always()
        run: |
          mkdir -p ../artifacts
          git add -A
          tree=$(git write-tree)
          printf '%s\n' "$tree" > ../artifacts/result-tree.txt
          git archive --format=tar.gz "$tree" > ../artifacts/source.tar.gz
          git diff --cached --binary > ../artifacts/change.patch
      - name: Publish verified feature source only
        if: steps.apply.outcome == 'success' && steps.quality.outcome == 'success' && steps.collect.outcome == 'success' && steps.tests.outcome == 'success' && steps.javascript.outcome == 'success' && steps.build.outcome == 'success'
        run: |
          test -z "$(git diff --cached --name-only -- .github)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(identity): replace OAuth providers with native key-approved sessions' -m 'Remove external account binding and OAuth authority. Preserve native signing, bounded browser access, legacy certificate validation and atomic storage migration.'
          git push origin HEAD:refs/heads/refactor/key-only-identity-20261011
          git rev-parse HEAD > ../artifacts/feature-commit.txt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: key-only-verification
          path: artifacts/
      - name: Require all verification steps
        if: always()
        env:
          QUALITY: ${{ steps.quality.outcome }}
          COLLECTION: ${{ steps.collect.outcome }}
          TESTS: ${{ steps.tests.outcome }}
          JAVASCRIPT: ${{ steps.javascript.outcome }}
          BUILD: ${{ steps.build.outcome }}
        run: test "$QUALITY/$COLLECTION/$TESTS/$JAVASCRIPT/$BUILD" = success/success/success/success/success
