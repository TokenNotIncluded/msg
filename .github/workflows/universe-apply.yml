name: Apply reviewed universe change
on:
  push:
    branches: [feat/post-universe]
    paths: [.github/workflows/universe-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'TokenNotIncluded/msg' && github.ref == 'refs/heads/feat/post-universe'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
      - name: Apply immutable reviewed patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, subprocess
          from pathlib import Path
          chunks = ['a666b289165d093e19c19e6eeaa52669e4a98c45', '1dce90875ed629911b44e321c696d470a3b02693', '6479306e6051d8f93b151777d86a6b5799a531ef', '46a9b3f61bd72225051dcabf882ecb55cb35c698']
          data = b''.join(base64.b64decode(json.loads(subprocess.check_output(['gh', 'api', 'repos/TokenNotIncluded/msg/git/blobs/' + sha]))['content']) for sha in chunks)
          patch = lzma.decompress(base64.b64decode(data))
          assert hashlib.sha256(patch).hexdigest() == 'f10bbd0ff73b3ed8f91c40ac821db35d390fa28ba81b2e672e8c10dc78987710'
          Path('/tmp/universe.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/universe.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/universe.patch'], check=True)
          PY
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install and format
        run: |
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
          uv run ruff check --fix --no-unsafe-fixes src/msg/transports/universe.py tests/test_universe.py scripts/check_universe_browser.py || true
          uv run ruff format src/msg/bootstrap.py src/msg/transports/http_routes.py src/msg/transports/universe.py src/msg/extensions/hosting.py tests/test_universe.py tests/test_branding.py scripts/check_universe_browser.py
          npx --yes prettier@3.6.2 --write src/msg/data/root-web-model.js src/msg/data/root-web-renderer.js src/msg/data/root-web-app.js src/msg/data/root-web.css
          node --check src/msg/data/root-web-model.js
          node --check src/msg/data/root-web-renderer.js
          node --check src/msg/data/root-web-app.js
      - name: Publish source on feature branch and remove this one-time helper
        run: |
          git rm .github/workflows/universe-apply.yml
          git add .github/workflows/post-universe.yml .impeccable/surfaces/root-web.md DESIGN.md docs/post-universe.md scripts/check_universe_browser.py src/msg/bootstrap.py src/msg/data/root-web* src/msg/extensions/hosting.py src/msg/transports/http_routes.py src/msg/transports/universe.py tests/test_branding.py tests/test_universe.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: replace root introduction with an explorable 3D post universe'
          git push origin HEAD:feat/post-universe
      - name: Install browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          uv run --with playwright==1.58.0 python -m playwright install --with-deps chromium
      - name: Verify backend privacy and real signature interoperability
        run: |
          mkdir -p artifacts
          uv run pytest tests/test_universe.py tests/test_branding.py tests/test_root_web_release.py tests/test_browser_workspace.py tests/test_hosting_same_origin.py --junitxml=artifacts/universe-tests.xml
      - name: Verify browser under production CSP
        if: always()
        env:
          PYTHONPATH: src
        run: uv run --with playwright==1.58.0 python scripts/check_universe_browser.py
      - name: Inspect Python quality
        if: always()
        run: uv run ruff check src/msg/transports/universe.py tests/test_universe.py scripts/check_universe_browser.py
      - name: Archive reviewed source and evidence
        if: always()
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz HEAD -o artifacts/post-universe-source.tar.gz
          git rev-parse HEAD > artifacts/commit.txt
          git diff --binary > artifacts/uncommitted.patch
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: post-universe-first-verification
          path: artifacts/
          retention-days: 7
