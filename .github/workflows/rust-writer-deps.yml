name: Rust writer dependency snapshot
on:
  push:
    branches: ['migration/rust-wire-phase1']
    paths: ['.github/workflows/rust-writer-deps.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Vendor exact writer lock dependency without credentials
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          mkdir -p /tmp/deps/src /tmp/export
          printf '[package]\nname="writer-deps"\nversion="0.0.0"\nedition="2021"\n[dependencies]\nfs2="=0.4.3"\n' > /tmp/deps/Cargo.toml
          echo 'fn main() {}' > /tmp/deps/src/main.rs
          cargo +1.85.0 vendor --manifest-path /tmp/deps/Cargo.toml /tmp/writer-vendor > /tmp/export/config.toml
          tar -czf /tmp/export/vendor.tar.gz -C /tmp writer-vendor
          cp /tmp/deps/Cargo.lock /tmp/export/Cargo.lock
          git rev-parse HEAD > /tmp/export/source-commit.txt
          sha256sum /tmp/export/vendor.tar.gz > /tmp/export/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: rust-writer-deps-${{ github.sha }}
          path: /tmp/export/
          retention-days: 1
          if-no-files-found: error
