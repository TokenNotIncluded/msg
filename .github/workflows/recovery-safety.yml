name: Recovery safety
on:
  push:
    branches: [main, fix/issues-68-70-recovery-safety]
  pull_request:
permissions:
  contents: read
concurrency:
  group: recovery-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U msgtest'
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.0.6
        ports: ['6379:6379']
        options: >-
          --health-cmd 'valkey-cli ping'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Install real cryptographic and database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age postgresql-client
          python -m pip install -e '.[dev]'
      - name: Compile and collect the complete suite
        run: |
          python -m compileall -q src
          mkdir -p artifacts
          python -m pytest --collect-only -q tests >artifacts/recovery-collection.txt 2>&1 || { cat artifacts/recovery-collection.txt; exit 1; }
          tail -n 3 artifacts/recovery-collection.txt
      - name: Verify recovery against real PostgreSQL and age
        run: |
          python -m pytest -q \
            tests/test_recovery_safety_units.py \
            tests/test_custody_exit_evidence.py \
            tests/test_custodial_upgrade.py \
            tests/test_custodial_historical_migration.py \
            tests/test_custodial_inventory_ack.py \
            tests/test_custodial_rewrap.py \
            tests/test_root_rotation.py \
            tests/test_root_rotation_resume.py \
            tests/test_root_storage_layout.py \
            tests/test_authority_snapshot_drift.py \
            tests/test_backup_drill.py \
            tests/test_backup_daemon.py \
            --junitxml=artifacts/recovery-safety.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery-safety-verification
          path: artifacts/
