name: AgentID integration acceptance
on:
  push:
    branches: [feat/agentid-native-login-20261009]
    paths:
      - .github/agentid-integration-patch.py
      - .github/workflows/agentid-integration-check.yml
      - tests/test_agentid_*.py
permissions:
  contents: write
concurrency:
  group: agentid-integration-20261009
  cancel-in-progress: false
jobs:
  acceptance:
    if: github.repository == 'TokenNotIncluded/msg'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 10s --health-timeout 5s --health-retries 5
      valkey:
        image: valkey/valkey:9.0.6
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo env NEEDRESTART_MODE=l apt-get install -y -qq age libpcsclite-dev swig
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
          uv pip check
          mkdir -p artifacts/agentid
      - name: Measure unchanged login baseline
        id: baseline
        continue-on-error: true
        run: |
          uv run pytest -q tests/test_login_providers.py tests/test_account_login.py tests/test_oauth.py --junitxml=artifacts/agentid/baseline.xml
      - name: Apply guarded source edits
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/agentid-integration-patch.py')
          text = path.read_text()
          # Correct two copied transport characters; the immutable SHA256 below
          # still validates the entire decoded edit document before any write.
          text = text.replace('GI6PDP/xo', 'GI6PD/xo').replace('wfeXPXPIL', 'wfeXPIL')
          path.write_text(text)
          PY
          python .github/agentid-integration-patch.py
      - name: Format and check changed Python files
        run: |
          files=(src/msg/login_config.py src/msg/security/login_flow.py src/msg/security/login_jwt.py src/msg/transports/login_providers.py src/msg/transports/account_login.py src/msg/transports/account_login_page.py tests/test_agentid_providers.py tests/test_agentid_account_login.py)
          uv run ruff check --fix "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run python -W error -m compileall -q src
      - name: Verify AgentID and existing login behavior
        run: |
          uv run pytest -q tests/test_agentid_providers.py tests/test_agentid_account_login.py tests/test_login_providers.py tests/test_account_login.py tests/test_oauth.py --junitxml=artifacts/agentid/acceptance.xml
          git diff --check
      - name: Commit only verified source and remove bootstrap files
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = feat/agentid-native-login-20261009
          git rm .github/agentid-integration-patch.py .github/workflows/agentid-integration-check.yml
          git add src/msg/login_config.py src/msg/security/login_flow.py src/msg/security/login_jwt.py src/msg/transports/login_providers.py src/msg/transports/account_login.py src/msg/transports/account_login_page.py tests/test_agentid_providers.py tests/test_agentid_account_login.py deploy/login.example.toml docs/ACCOUNT_LOGIN.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat(auth): add verified native AgentID login and account binding'
          git rev-parse HEAD | tee artifacts/agentid/verified-commit.txt
          git rev-parse HEAD^{tree} | tee artifacts/agentid/verified-tree.txt
          git show --stat --oneline HEAD
          git push origin HEAD:refs/heads/feat/agentid-native-login-20261009
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: agentid-integration-evidence
          path: artifacts/agentid/
