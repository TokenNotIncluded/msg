name: Rust PostgreSQL editor snapshot
on:
  push:
    branches: ['migration/rust-*']
    paths: ['.github/workflows/rust-postgres-editor.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Export public TLS crates and disposable PostgreSQL binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pg-editor /tmp/pg-deps/src /tmp/pg-deps/.cargo
          rustup toolchain install 1.85.0 --profile minimal
          cat > /tmp/pg-deps/Cargo.toml <<'TOML'
          [package]
          name="msg-pg-editor-dependencies"
          version="0.0.0"
          edition="2021"
          rust-version="1.85"
          [dependencies]
          postgres="=0.19.12"
          postgres-native-tls="=0.5.2"
          native-tls="=0.2.14"
          openssl="=0.10.75"
          serde_json="=1.0.145"
          TOML
          printf '[resolver]\nincompatible-rust-versions="fallback"\n' > /tmp/pg-deps/.cargo/config.toml
          echo 'fn main() {}' > /tmp/pg-deps/src/main.rs
          (cd /tmp/pg-deps && cargo +1.85.0 vendor --versioned-dirs /tmp/pg-vendor > /tmp/pg-vendor-config.toml)
          tar -czf /tmp/pg-editor/vendor.tar.gz -C /tmp pg-vendor pg-vendor-config.toml
          cp /tmp/pg-deps/Cargo.lock /tmp/pg-editor/
          PG=$(find /usr/lib/postgresql -type f -path '*/bin/postgres' | sort -V | tail -n1)
          test -n "$PG"
          BINDIR=$(dirname "$PG")
          SHARED=$($BINDIR/pg_config --sharedir)
          PKGLIB=$($BINDIR/pg_config --pkglibdir)
          mkdir -p /tmp/pg-export/bin /tmp/pg-export/share /tmp/pg-export/lib /tmp/pg-export/deps
          cp -a "$BINDIR"/. /tmp/pg-export/bin/
          cp -a "$SHARED"/. /tmp/pg-export/share/
          cp -a "$PKGLIB"/. /tmp/pg-export/lib/
          printf '%s\n%s\n%s\n' "$BINDIR" "$SHARED" "$PKGLIB" > /tmp/pg-export/original-paths.txt
          "$PG" --version > /tmp/pg-export/version.txt
          find /tmp/pg-export/bin /tmp/pg-export/lib -type f -print0 | xargs -0 -r -n1 sh -c 'ldd "$0" 2>/dev/null || true' | awk '/=> \/|^\s*\// {for(i=1;i<=NF;i++)if($i ~ /^\//)print $i}' | sort -u > /tmp/pg-export/dependencies.txt
          while IFS= read -r lib; do
            case "$(basename "$lib")" in libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libresolv.so.*|ld-linux*) continue ;; esac
            cp -L "$lib" /tmp/pg-export/deps/
          done < /tmp/pg-export/dependencies.txt
          tar -cJf /tmp/pg-editor/postgres.tar.xz -C /tmp pg-export
          git rev-parse HEAD > /tmp/pg-editor/source-commit.txt
          (cd /tmp/pg-editor && sha256sum *.tar.* Cargo.lock > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: msg-pg-editor-${{ github.sha }}
          path: /tmp/pg-editor/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
