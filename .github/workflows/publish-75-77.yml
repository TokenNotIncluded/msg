name: Materialize reviewed issue 75-77 patch
on:
  push:
    branches: [work/issue-75-77-hardening]
    paths:
      - .github/publish-75-77/**
      - .github/workflows/publish-75-77.yml
permissions:
  contents: write
concurrency:
  group: publish-75-77
  cancel-in-progress: false
jobs:
  materialize:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best' && github.ref == 'refs/heads/work/issue-75-77-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}
      - name: Verify the reviewed patch and apply without changing unrelated code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 054c213177afbd0834a2b8a05634157046410677
          python3 - <<'PY'
          import base64, gzip, hashlib, os
          from pathlib import Path
          encoded = ''.join(Path(f'.github/publish-75-77/{i}.b64').read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '4690abe9cdb32d294ff455d4a4e794a6d345ce932a2af8cf64b97a4ae2bbf427'
          Path(os.environ['RUNNER_TEMP'], 'reviewed.patch').write_bytes(patch)
          PY
          git apply --check "$RUNNER_TEMP/reviewed.patch"
          git apply --index "$RUNNER_TEMP/reviewed.patch"
          test "$(git diff --cached --name-only | wc -l)" -eq 20
          git diff --cached --check
          git rm -r .github/publish-75-77 .github/workflows/publish-75-77.yml
          git diff --cached --stat
      - name: Publish only the requested feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Harden escrow decisions, current sharing and personal proofs' -m 'Refs #75, #76, #77. Publish the reviewed partial implementation; remaining acceptance work stays open. Remove the one-use patch materializer from the resulting tree.'
          git diff 054c213177afbd0834a2b8a05634157046410677 HEAD --check
          git push origin HEAD:refs/heads/work/issue-75-77-hardening
          printf 'Published feature commit `%s`. Full PR CI is still required.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
