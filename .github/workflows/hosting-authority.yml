name: Hosting authority regression
on:
  push:
    branches: ['fix/hosting-authority-*']
  pull_request:
    paths:
      - 'src/msg/hosting_runtime.py'
      - 'src/msg/storage/read_only.py'
      - 'tests/test_hosting_runtime_authority.py'
      - '.github/workflows/hosting-authority.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-authority-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U msgtest -d postgres'
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Bind evidence to source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, pathlib, platform, subprocess
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          pathlib.Path('artifacts/source.json').write_text(json.dumps({
              'head':os.environ['HEAD_SHA'], 'checkout':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'), 'python':platform.python_version(),
              'run_id':os.environ['GITHUB_RUN_ID'], 'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2)+'\n')
          PY
      - name: Install disposable test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          python -m pip install -e '.[dev]'
      - name: Exercise revoked keys and restorable ownership rights
        run: python -m pytest tests/test_hosting_runtime_authority.py --junitxml=artifacts/authority.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosting-authority-evidence
          path: artifacts/
          if-no-files-found: error
