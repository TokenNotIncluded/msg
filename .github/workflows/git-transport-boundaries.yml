name: Git transport boundary contracts
on:
  push:
    branches: [fix/git-transport-boundaries-20260929]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: git-transport-boundaries-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 5s --health-timeout 5s --health-retries 10
      valkey:
        image: valkey/valkey:9.0.6
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Install actual Git, LFS and cryptographic test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age git-lfs
          git --version
          git lfs version
          python -m pip install -e '.[dev]'
      - name: Record exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          Path('artifacts/source.json').write_text(json.dumps({'commit':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'),'event_sha':os.environ['SOURCE_SHA'],
              'dirty':bool(git('status','--porcelain'))},indent=2)+'\n')
          PY
      - name: Verify ownership and unchanged real Git reads
        run: python -m pytest tests/test_git_transport_boundaries.py --junitxml=artifacts/git-boundaries.xml
      - name: Preserve real HTTP, SSH, bundle, LFS and publication fences
        run: |
          python -m pytest tests/test_git_http_push.py tests/test_native_git_read_only.py tests/test_git_lfs.py tests/test_lfs_shared_gc_quota.py tests/test_ssh_rss.py tests/test_extensions.py tests/test_storage_layout.py tests/test_effect_completion_fencing.py tests/issue_78_80/test_lfs_integrity.py tests/issue_78_80/test_lfs_migration_contract.py --junitxml=artifacts/git-regressions.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-transport-boundaries-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
