name: First-read repair acceptance
on:
  push:
    branches: [fix/home-first-read-20261009]
    paths: ['.github/workflows/bootstrap-home-first-read.yml', '.ci/home-first-read*']
permissions:
  contents: write
jobs:
  accept:
    if: github.ref == 'refs/heads/fix/home-first-read-20261009'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      TARGET_BRANCH: fix/home-first-read-20261009
      BASE_SHA: 02da87322ff134edb031cce837fa683f8999a12a
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Verify exact base and transferred patch before applying anything
        run: |
          test "$GITHUB_REF" = "refs/heads/$TARGET_BRANCH"
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          git diff --exit-code "$BASE_SHA" -- src tests scripts
          mkdir -p artifacts
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          encoded = ''.join(Path(f'.ci/home-first-read.part{i}').read_text() for i in range(4))
          patch = gzip.decompress(base64.b64decode(encoded))
          digest = hashlib.sha256(patch).hexdigest()
          assert digest == '6e0b0767ccd7aa4d0b503792c0bebd6180968f7151c35c4b170650ff4148a571', digest
          Path('/tmp/home-first-read.patch').write_bytes(patch)
          Path('artifacts/input-patch.sha256').write_text(digest + '\n')
          PY
          git apply --check /tmp/home-first-read.patch
      - name: Install project and independent browser tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age libpcsclite-dev swig
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
          uv run python -m playwright install --with-deps chromium
      - name: Demonstrate missing first-response posts on unchanged main source
        run: |
          git apply --include=tests/test_home_first_read.py /tmp/home-first-read.patch
          set +e
          uv run pytest tests/test_home_first_read.py::test_cold_summary_keeps_posts_in_first_response --junitxml=artifacts/before.xml > artifacts/before.log 2>&1
          status=$?
          set -e
          cat artifacts/before.log
          test "$status" -eq 1
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          tree = ET.parse('artifacts/before.xml')
          cases = tree.findall('.//testcase')
          assert len(cases) == 1
          assert not tree.findall('.//error')
          assert not tree.findall('.//skipped')
          failure = cases[0].find('failure')
          assert failure is not None
          assert 'First visit post</a>' in failure.text, failure.text
          assert 'href=' in failure.text
          Path('tests/test_home_first_read.py').unlink()
          PY
      - name: Apply reviewed changes and normalize with repository formatter
        run: |
          git apply --check /tmp/home-first-read.patch
          git apply /tmp/home-first-read.patch
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/check_home_first_read_browser.py')
          text = path.read_text()
          old = 'lambda error: errors.append(str(error))'
          assert text.count(old) == 1
          path.write_text(text.replace(old, 'lambda error, errors=errors: errors.append(str(error))'))
          PY
          files=(src/msg/transports/{browser_style,home_page,http_routes,thread_browser}.py tests/{test_home_first_read,test_browser_refinement,test_thread_panel}.py scripts/check_home_first_read_browser.py)
          uv run ruff check --fix --no-unsafe-fixes "${files[@]}"
          uv run ruff format "${files[@]}"
          uv run ruff check "${files[@]}"
          uv run ruff format --check "${files[@]}"
          uv run python -W error -m compileall -q src
          uv pip check
          git diff --check
      - name: Verify first reads and existing browser authority on real PostgreSQL
        run: |
          set -o pipefail
          uv run pytest tests/test_home_first_read.py tests/test_home_cache.py tests/test_browser_refinement.py tests/test_browser_html.py tests/test_browser_languages.py tests/test_thread_panel.py tests/test_thread_panel_http.py tests/test_board_presentation.py --junitxml=artifacts/after.xml 2>&1 | tee artifacts/after.log
          python - <<'PY'
          from xml.etree import ElementTree as ET
          tree = ET.parse('artifacts/after.xml')
          assert tree.findall('.//testcase')
          assert not tree.findall('.//error')
          assert not tree.findall('.//failure')
          assert not tree.findall('.//skipped')
          PY
      - name: Verify real browser navigation and render desktop/mobile themes under CSP
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          uv run python scripts/check_home_first_read_browser.py 2>&1 | tee artifacts/browser.log
      - name: Commit only validated source on the task branch and remove bootstrap files
        run: |
          git rm .github/workflows/bootstrap-home-first-read.yml .ci/home-first-read.patch.gz.b64 .ci/home-first-read.part{0,1,2,3}
          git add .github/workflows/home-first-read.yml scripts/check_home_first_read_browser.py src/msg/transports/{browser_style,home_page,http_routes,thread_browser}.py tests/{test_home_first_read,test_browser_refinement,test_thread_panel}.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(browser): show posts on the first visit and refine reading layout'
          git diff "$BASE_SHA" HEAD --binary > artifacts/verified-source.patch
          git rev-parse HEAD > artifacts/verified-commit.txt
          git rev-parse HEAD^{tree} > artifacts/verified-tree.txt
          git archive HEAD .github/workflows/home-first-read.yml scripts/check_home_first_read_browser.py src/msg/transports/{browser_style,home_page,http_routes,thread_browser}.py tests/{test_home_first_read,test_browser_refinement,test_thread_panel}.py | gzip > artifacts/verified-files.tar.gz
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: first-read-repair-acceptance
          path: artifacts/
          retention-days: 7
