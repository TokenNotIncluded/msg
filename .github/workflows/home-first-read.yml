name: Browser first read
on:
  pull_request:
    paths:
      - 'src/msg/transports/**'
      - 'src/msg/plugins/discovery*'
      - 'tests/test_home*'
      - 'tests/test_browser*'
      - 'tests/test_thread*'
      - 'scripts/check_home_first_read_browser.py'
      - '.github/workflows/home-first-read.yml'
  push:
    branches: [main]
    paths:
      - 'src/msg/transports/**'
      - 'src/msg/plugins/discovery*'
      - 'tests/test_home*'
      - 'tests/test_browser*'
      - 'tests/test_thread*'
      - 'scripts/check_home_first_read_browser.py'
      - '.github/workflows/home-first-read.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-first-read-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest -d postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age libpcsclite-dev swig
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
          uv run python -m playwright install --with-deps chromium
      - name: Verify first reads, authority and existing browser routes
        run: |
          mkdir -p artifacts
          uv run pytest tests/test_home_first_read.py tests/test_home_cache.py tests/test_browser_refinement.py tests/test_browser_html.py tests/test_browser_languages.py tests/test_thread_panel.py tests/test_thread_panel_http.py tests/test_board_presentation.py --junitxml=artifacts/browser-first-read-tests.xml
      - name: Verify real navigation and responsive rendering under CSP
        env:
          PYTHONPATH: src
        run: uv run python scripts/check_home_first_read_browser.py
      - name: Check changed source and tests
        run: |
          uv run ruff check src/msg/transports/{browser_style,home_page,http_routes,thread_browser}.py tests/{test_home_first_read,test_browser_refinement,test_thread_panel}.py scripts/check_home_first_read_browser.py
          uv run ruff format --check src/msg/transports/{browser_style,home_page,http_routes,thread_browser}.py tests/{test_home_first_read,test_browser_refinement,test_thread_panel}.py scripts/check_home_first_read_browser.py
          uv run python -W error -m compileall -q src
          git diff --check
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: browser-first-read-evidence
          path: artifacts/
          retention-days: 7
