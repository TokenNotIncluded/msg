name: Apply reviewed client boundary patch
on:
  push:
    branches: ['fix/client-boundary-20260929']
    paths: ['scripts/patches/client-boundary.patch']
permissions:
  contents: read
jobs:
  apply-reviewed-patch:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Apply only the reviewed patch to its recorded parent
        run: |
          test "$(git rev-parse HEAD^)" = 6ea463d6fa8b256cb07d0ede2d7795a5336eda4f
          git apply --index --check scripts/patches/client-boundary.patch
          git apply --index scripts/patches/client-boundary.patch
          git diff --cached --check
      - name: Publish only this feature branch without force
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib, json, os, pathlib, subprocess, urllib.request
          repo = 'TokenNotIncluded/msg.lmm.best'
          branch = 'fix/client-boundary-20260929'
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + branch
          paths = [
              'README.md', 'docs/DEPLOYMENT.md', 'pyproject.toml', 'src/msg/atomic_file.py',
              'src/msg/cli.py', 'src/msg/client.py', 'src/msg/client_certificates.py',
              'src/msg/client_custodial.py', 'src/msg/client_upgrade.py', 'src/msg/core/codec.py',
              'src/msg/core/executor.py', 'src/msg/daemon.py', 'src/msg/security/custodial_migration.py',
              'src/msg/security/custodial_protocol.py', 'src/msg/security/vault.py',
              'src/msg/storage/git.py', 'src/msg/transports/client.py', 'src/msg/transports/mcp.py',
              'src/msg/transports/mcp_protocol.py',
          ]
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines()
          assert sorted(changed) == sorted(paths), changed
          def api(method, endpoint, payload=None):
              data = None if payload is None else json.dumps(payload).encode()
              request = urllib.request.Request('https://api.github.com/repos/' + repo + endpoint,
                  data=data, method=method, headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  })
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          parent = os.environ['GITHUB_SHA']
          assert api('GET', '/git/ref/heads/' + branch)['object']['sha'] == parent
          old = api('GET', '/git/commits/' + parent)
          assert [p['sha'] for p in old['parents']] == ['6ea463d6fa8b256cb07d0ede2d7795a5336eda4f']
          entries = [{'path': p, 'mode': '100644', 'type': 'blob',
                      'content': pathlib.Path(p).read_text()} for p in paths]
          for p in ['scripts/patches/client-boundary.patch', '.github/workflows/prepare-client-boundary.yml']:
              entries.append({'path': p, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('POST', '/git/trees', {'base_tree': old['tree']['sha'], 'tree': entries})
          commit = api('POST', '/git/commits', {
              'message': 'refactor(client): isolate shared protocol helpers and client-only dependencies\n\nRefs #158 #82 #83 #85. Preserve signed bytes, credential persistence and explicit full-server installation.',
              'tree': tree['sha'], 'parents': [parent],
          })
          api('PATCH', '/git/refs/heads/' + branch, {'sha': commit['sha'], 'force': False})
          pathlib.Path('artifacts').mkdir(exist_ok=True)
          pathlib.Path('artifacts/patch-result.json').write_text(json.dumps({
              'source': parent, 'commit': commit['sha'], 'tree': tree['sha'],
              'patch_sha256': hashlib.sha256(pathlib.Path('scripts/patches/client-boundary.patch').read_bytes()).hexdigest(),
              'paths': paths,
          }, indent=2) + '\n')
          print('Published reviewed source:', commit['sha'], tree['sha'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: client-patch-result
          path: artifacts/
