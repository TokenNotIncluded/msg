name: Market implementation import
on:
  push:
    branches: [fix/market-73-75]
    paths: [.github/workflows/market-dev-runtime.yml]
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best' && github.ref == 'refs/heads/fix/market-73-75'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Retrieve exact reviewed source patch
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-time 60 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-d608-8206-9427-33716cb1ffbf/raw?se=2026-09-27T20%3A35%3A07Z&sp=r&sv=2026-02-06&sr=b&scid=2a292c8f-a1e0-5694-8eeb-906301575dc8&skoid=0765b554-4b90-4fa2-9d6d-0055a2427910&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-27T15%3A55%3A13Z&ske=2026-09-28T15%3A55%3A13Z&sks=b&skv=2026-02-06&sig=AyHi4lgIeRVAFDpDTl13UIoOzFPVwCK4KrlSgnm05Fs%3D' -o /tmp/market.patch
          echo 'bd600937773574aa2bfd87b46c46402e4ce46a8dd340f00b49a9b5bd5107abbb  /tmp/market.patch' | sha256sum --check
      - uses: actions/checkout@v7
        with:
          ref: fix/market-73-75
          fetch-depth: 0
      - name: Preserve concurrent main fixes and commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          git apply --check /tmp/market.patch
          git apply --index /tmp/market.patch
          git rm .github/workflows/market-dev-runtime.yml
          git diff --cached --check
          git commit -m 'feat(market): versioned escrow, private delivery and deterministic arbitration' -m 'Implement #73, #74 and #75. Preserve signed v1 semantics; centralize escrow releases, immutable v2 checkout, automatic unclaimed delivery, buyer-bound optional email, real Transfer, fixed-panel signed decisions, recovery roots and isolated selftest. Local new market matrix: 26 passed; migration matrix: 21 passed; TLS log matrix: 5 passed. Production is untouched.'
          git push origin HEAD:refs/heads/fix/market-73-75
          mkdir -p /tmp/market-integration/source
          git archive HEAD | tar -x -C /tmp/market-integration/source
          git rev-parse HEAD > /tmp/market-integration/source-sha
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Export matching offline integration fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/market-integration/{git/bin,git/lib,git/libexec,tiktoken}
          sudo apt-get update -qq
          sudo apt-get install -y -qq git-lfs
          cp /usr/bin/git /usr/bin/git-lfs /tmp/market-integration/git/bin/
          cp -a "$(git --exec-path)"/. /tmp/market-integration/git/libexec/
          for binary in /tmp/market-integration/git/bin/* /tmp/market-integration/git/libexec/*; do
            ldd "$binary" 2>/dev/null | awk '/=> \/.* \(/ {print $3}' || true
          done | sort -u | while read -r library; do cp -L "$library" /tmp/market-integration/git/lib/; done
          python -m pip install tiktoken
          TIKTOKEN_CACHE_DIR=/tmp/market-integration/tiktoken python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
          tar -czf /tmp/market-integration.tar.gz -C /tmp market-integration
      - uses: actions/upload-artifact@v4
        with:
          name: market-integration
          retention-days: 1
          path: /tmp/market-integration.tar.gz
