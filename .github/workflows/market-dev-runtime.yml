name: Market development runtime
on:
  push:
    branches: [fix/market-73-75]
    paths: [.github/workflows/market-dev-runtime.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ac083b3666b1b5268d90115129e2cc4e0dd11521
          persist-credentials: false
      - name: Export regression-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/market-extra/{legacy,valkey/bin,valkey/lib}
          git archive HEAD | tar -x -C /tmp/market-extra/legacy
          docker pull valkey/valkey:9.0.6
          cid=$(docker create valkey/valkey:9.0.6)
          trap 'docker rm -f "$cid" >/dev/null' EXIT
          for binary in valkey-server valkey-cli; do
            docker cp "$cid:/usr/local/bin/$binary" "/tmp/market-extra/valkey/bin/$binary"
          done
          docker run --rm --entrypoint sh valkey/valkey:9.0.6 -c 'ldd /usr/local/bin/valkey-server; ldd /usr/local/bin/valkey-cli' | awk '/=> \/.* \(/ {print $3}' | sort -u | while read -r library; do
            docker cp "$cid:$library" "/tmp/market-extra/valkey/lib/$(basename "$library")"
          done
          tar -czf /tmp/market-extra.tar.gz -C /tmp market-extra
      - uses: actions/upload-artifact@v4
        with:
          name: market-extra
          retention-days: 1
          path: /tmp/market-extra.tar.gz
