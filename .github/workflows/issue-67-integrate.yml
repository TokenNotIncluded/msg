name: Integrate issue 67 regression branches
on:
  push:
    branches: [fix/issue-67-credential-recovery]
    paths: [.github/workflows/issue-67-integrate.yml]
permissions:
  contents: read
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-67-credential-recovery
          fetch-depth: 2
      - uses: actions/checkout@v7
        with:
          ref: 50b3038e2fe002769824aa8eca4d06ff1095b2ae
          path: .issue67-supplement
          persist-credentials: false
      - name: Preserve primary implementation and add pinned supplemental coverage
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = b92bf4adbf41ef3a0d3017ef6a734ebb1a60b82c
          python - <<'PY'
          import hashlib, shutil
          from pathlib import Path
          additions = (
              'src/msg/admin/diagnostics.py', 'src/msg/admin/token_delivery_check.py',
              'src/msg/data/bootstrap.json', 'tests/test_credential_delivery_matrix.py',
              'tests/test_credential_delivery_contract.py', 'tests/test_credential_upgrade_interleave.py',
          )
          for name in additions:
              shutil.copyfile(Path('.issue67-supplement') / name, name)
          p=Path('src/msg/admin/token_delivery_check.py'); s=p.read_text()
          s=s.replace('from msg.client import ClientState, MsgClient',
                      'from msg.client import ClientState, MsgClient\nfrom msg.client_tokens import read_journal')
          s=s.replace('            # Both processes can restart; refreshing only the request expiry\n'
                      '            # does not refresh either the token lifetime or recovery deadline.',
                      '            # Reload the client from disk. Full client/server restarts are also\n'
                      '            # exercised in the protocol regression matrix.')
          s=s.replace('client._token_journal() == (None, None)', 'read_journal(state) == (None, None)')
          p.write_text(s)
          p=Path('tests/test_credential_delivery_matrix.py'); s=p.read_text()
          s=s.replace('from msg.client import ClientState, MsgClient',
                      'from msg.client import ClientState, MsgClient\nfrom msg.client_tokens import read_journal')
          s=s.replace('client._token_journal()', 'read_journal(client.state)')
          s=s.replace('8193', '65537')
          s=s.replace("match='identity_upgrade_busy'", "match='token_operation_busy'")
          p.write_text(s)
          p=Path('src/msg/client_journal.py'); s=p.read_text()
          needle='\ndef _owned_regular(info, code):\n'
          addition='''
          @contextmanager
          def locked_state(state, *, busy='identity_upgrade_busy', unsafe='unsafe_upgrade_lock'):
              """Reload accepted state only after acquiring the shared transition lock."""
              with identity_lock(state.directory, busy=busy, unsafe=unsafe):
                  fresh = type(state)(state.directory, server=state.server)
                  state.data, state.signer = fresh.data, fresh.signer
                  state.encryption_recipient = fresh.encryption_recipient
                  yield
          '''
          assert s.count(needle)==1
          s=s.replace(needle, '\n'+addition+'\ndef _owned_regular(info, code):\n')
          p.write_text(s)
          p=Path('src/msg/client_tokens.py'); s=p.read_text()
          s=s.replace('from msg.client_journal import identity_lock, read_owned_json, remove_journal',
                      'from msg.client_journal import locked_state, read_owned_json, remove_journal')
          start=s.index('\ndef _reload(state):'); end=s.index('\ndef pending_delivery(state):', start)
          s=s[:start]+s[end:]
          old="    with identity_lock(state.directory, busy='token_operation_busy', unsafe='unsafe_token_lock'):\n        _reload(state)"
          assert s.count(old)==2
          s=s.replace(old,"    with locked_state(state, busy='token_operation_busy', unsafe='unsafe_token_lock'):")
          p.write_text(s)
          p=Path('src/msg/client_upgrade.py'); s=p.read_text()
          s=s.replace('from msg.core.codec import b64, canonical, loads, wire',
                      'from msg.core.codec import b64, canonical, loads, wire\nfrom msg.client_journal import locked_state')
          assert s.count('    with upgrade_lock(state.directory):')==1
          s=s.replace('    with upgrade_lock(state.directory):', '    with locked_state(state):')
          p.write_text(s)
          p=Path('src/msg/client.py'); s=p.read_text()
          needle='    async def upgrade_custodial(self,handle, *, external_ciphertexts_migrated: bool):\n'
          replacement='''    async def upgrade_custodial(self,handle, *, external_ciphertexts_migrated: bool):
                  from msg.client_journal import locked_state
                  self._require_token_secret_transport()
                  with locked_state(self.state):
                      require(not any((self.state.directory/name).exists() or
                                      (self.state.directory/name).is_symlink() for name in
                                      ('identity-upgrade.json','temporary.json','token-create.json',
                                       'custodial-bootstrap.json','token-rotation.json')),
                              'identity_recovery_pending')
                      return await self._upgrade_custodial(handle,
                          external_ciphertexts_migrated=external_ciphertexts_migrated)

              async def _upgrade_custodial(self,handle, *, external_ciphertexts_migrated: bool):
          '''
          assert s.count(needle)==1
          p.write_text(s.replace(needle,replacement))
          expected={
              'src/msg/client.py':'6b782ef27acd42adddbffc19e2aa64835062df50a68741fee1c093ec9da86ca4',
              'src/msg/client_journal.py':'f160b1af40c297a5b9a83b5d9af2388c49789e0d6f0b5fea0ae824a471ad2b6b',
              'src/msg/client_tokens.py':'07689b75bbfeae790002eb76a718b013b142001869a141c9e9e4f2bbf9d7a4e1',
              'src/msg/client_upgrade.py':'c122bdcaca364475dd432d6321d40155c0b9e42c8b2170a88df489b54d9ec8c4',
              'src/msg/admin/diagnostics.py':'0966f5bf4b6820e02f595a74974493dbf33b0a134ab54b8d2f21533040c7df34',
              'src/msg/admin/token_delivery_check.py':'56773c354af96a576aa915642b657722983e72f85ab069d886398fb9056632b2',
              'src/msg/data/bootstrap.json':'63e10d82752435ff4f93d6b93759ae39ac611306266d3130fc52afe16e1d2ccb',
              'tests/test_credential_delivery_matrix.py':'5c4aba2d1ae8cb43a2694ed5734f082d655c390d82c8207c29451bb58719b31b',
              'tests/test_credential_delivery_contract.py':'543dbbd348fbb5748638ab73a4a6cf03c8d91f8fb2f013f1b56d4bdf2a1fbb63',
              'tests/test_credential_upgrade_interleave.py':'2572cb343bf5f875276ed98d928c6f68896b393e35dca09d9d913eda2adf396d',
          }
          for name, digest in expected.items():
              actual=hashlib.sha256(Path(name).read_bytes()).hexdigest()
              assert actual==digest, (name, actual)
          PY
          rm .github/workflows/issue-67-integrate.yml
          git diff --check
          git add src/msg/client.py src/msg/client_journal.py src/msg/client_tokens.py src/msg/client_upgrade.py src/msg/admin/diagnostics.py src/msg/admin/token_delivery_check.py src/msg/data/bootstrap.json tests/test_credential_delivery_matrix.py tests/test_credential_delivery_contract.py tests/test_credential_upgrade_interleave.py .github/workflows/issue-67-integrate.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Unify credential recovery with fresh upgrade state and supplemental contracts' -m 'Refs #67. Preserve PR89 create-token and all existing regression tests; integrate unique PR90 doctor/selftest, transport, release and interleaving coverage. Six stale/concurrent upgrade cases reproduced on PR89 before correction. Final integrated-head full CI is still required. No production changes. Remove temporary publishing workflow.'
          git push origin HEAD:refs/heads/fix/issue-67-credential-recovery
