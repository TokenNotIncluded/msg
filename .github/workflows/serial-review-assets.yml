name: Isolated serial review assets
on:
  push:
    branches: [chore/serial-review-assets-20260928]
permissions:
  contents: read
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 0c6ca7cf8262e1b70f96fb3fb18d64a88a8e299b
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Export exact public source and offline Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-assets/wheels" "$RUNNER_TEMP/review-assets/debs"
          out="$RUNNER_TEMP/review-assets"
          test "$(git rev-parse HEAD)" = 0c6ca7cf8262e1b70f96fb3fb18d64a88a8e299b
          git rev-parse HEAD HEAD^{tree} > "$out/source-revision.txt"
          git bundle create "$out/source.bundle" HEAD
          git archive --format=tar.gz HEAD > "$out/source.tar.gz"
          python - <<'PY'
          import os, pathlib, subprocess, sys, tomllib
          config = tomllib.loads(pathlib.Path('pyproject.toml').read_text())
          dependencies = config['project']['dependencies'] + config['project']['optional-dependencies']['dev']
          dependencies += config['build-system']['requires']
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'review-assets' / 'wheels'
          subprocess.run([sys.executable, '-m', 'pip', 'download', '--only-binary=:all:', '--dest', str(out), *dependencies], check=True)
          PY
      - name: Export disposable Debian test tools without an installed database
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$RUNNER_TEMP/review-assets/debs:/out" debian:bookworm-slim bash -euc '
            apt-get update -qq
            apt-get --download-only install -y --no-install-recommends postgresql-15 postgresql-client-15 age redis-server
            cp /var/cache/apt/archives/*.deb /out/
          '
      - name: Bind asset bytes to checksums
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/review-assets"
          find . -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/assets.sha256"
          mv "$RUNNER_TEMP/assets.sha256" ./SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: serial-review-assets-20260928
          path: ${{ runner.temp }}/review-assets/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
