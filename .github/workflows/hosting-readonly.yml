name: Hosting read-only boundary
on:
  push:
    branches: ['fix/hosting-readonly-20260929']
  pull_request:
    paths:
      - 'src/msg/**'
      - 'tests/**'
      - 'deploy/**'
      - '.github/workflows/hosting-readonly.yml'
      - 'pyproject.toml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hosting-readonly-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  hosting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age libpcsclite-dev swig
          python -m pip install -e '.[dev]'
      - name: Bind evidence to checkout and requested head
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, platform, shutil, subprocess
          from pathlib import Path
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          Path('artifacts/source.json').write_text(json.dumps({
              'head':os.environ['HEAD_SHA'], 'checkout':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'), 'python':platform.python_version(),
              'run_id':os.environ['GITHUB_RUN_ID'], 'attempt':os.environ['GITHUB_RUN_ATTEMPT']},indent=2))
          for source in Path('tests').glob('test_hosting*.py'):
              shutil.copyfile(source,Path('artifacts')/source.name)
          PY
      - name: Exercise isolated hosting and retain established web regressions
        run: >-
          python -m pytest tests/test_hosting*.py tests/test_cli_hosting.py
          tests/test_extensions.py::test_hosting_publish_is_explicit_versioned_on_service_origin
          --junitxml=artifacts/hosting.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: hosting-readonly-evidence
          path: artifacts/
          if-no-files-found: error
