name: Metadata session contracts
on:
  push:
    branches: [fix/metadata-session-boundary-20260929]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: metadata-session-${{ github.ref }}
  cancel-in-progress: false
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age libpcsclite-dev swig
          python -m pip install -e '.[dev]'
      - name: Record exact source
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p artifacts
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          git=lambda *args: subprocess.check_output(['git',*args],text=True).strip()
          Path('artifacts/source.json').write_text(json.dumps({'commit':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'),'event_sha':os.environ['SOURCE_SHA'],
              'dirty':bool(git('status','--porcelain'))},indent=2)+'\n')
          PY
      - name: Run the same contract on both real database adapters
        run: python -m pytest tests/test_metadata_session_boundary.py --junitxml=artifacts/metadata-session.xml
      - name: Preserve PostgreSQL locks, migration and recovery regressions
        run: |
          python -m pytest tests/test_postgres.py tests/test_security_storage_rollback.py tests/test_security_rollback_fences.py tests/test_ledger_accounts.py tests/test_ledger_account_isolation.py tests/test_ledger_migration_json.py tests/test_ledger_migration_references.py tests/test_recovery_safety_units.py tests/test_recovery_metadata.py --junitxml=artifacts/metadata-regressions.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: metadata-session-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
