name: Prepare PR 142 followup
on:
  push:
    branches: [workbench/security-142-source-20260928]
    paths: [.github/workflows/security-followup-prepare.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cbc5741d45afccafca9f189f4cd27c3f94300b4e
          fetch-depth: 0
      - name: Verify and prepare source-only commit on a separate staging ref
        env:
          PATCH_B64: ''
        run: |
          python - <<'PY'
          import base64, hashlib, os, pathlib, zlib
          patch = zlib.decompress(base64.b64decode(os.environ['PATCH_B64'], validate=True))
          assert hashlib.sha256(patch).hexdigest() == '931f889e681e443d3d25bd6edb432fb3d8c25a7f2ad232c01b3d4a9d481e5e95'
          pathlib.Path('/tmp/security-followup.patch').write_bytes(patch)
          PY
          test "$(git rev-parse HEAD)" = cbc5741d45afccafca9f189f4cd27c3f94300b4e
          git apply --check /tmp/security-followup.patch
          git apply --index /tmp/security-followup.patch
          git diff --cached --check
          test "$(git write-tree)" = 54b39853ab2ac0f25164ed90ec0fd6b7e300a065
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(security): retain rollback fences and compensate cancelled upload pins'
          git push origin HEAD:refs/heads/workbench/security-142-prepared-20260928
          git rev-parse HEAD HEAD^{tree}
