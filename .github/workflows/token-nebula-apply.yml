name: Apply token nebula local patch
on:
  push:
    branches: [main]
    paths: [.github/workflows/token-nebula-apply.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Restore reviewed local files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, json, lzma, subprocess, tarfile
          from pathlib import Path
          shas = ['daaa09ec6b46ceac9911c0599743c723c47bb69b','df8f8fbf68fa168f9abdd3034aedb9f48706d362','c36075b2a2793ed46ee64b76e73135b8f693af2b','f5414d0626e01ef92ba1840cca1fd26915fbd3d8']
          text = ''.join(json.loads(subprocess.check_output(['gh','api','repos/TokenNotIncluded/msg/git/blobs/'+s]))['content'] for s in shas)
          data = base64.b64decode(text)
          Path('/tmp/nebula.tar.xz').write_bytes(data)
          with tarfile.open('/tmp/nebula.tar.xz','r:xz') as t:
              t.extractall('.', filter='data')
          PY
      - name: Verify JS semantics
        run: |
          node --check src/msg/data/root-web-model.js
          node --check src/msg/data/root-web-app.js
          node --check src/msg/data/root-web-renderer.js
          node --test tests/js/nebula.test.cjs
      - name: Commit and push
        run: |
          git add .impeccable/surfaces/root-web.md docs/post-universe.md scripts/check_nebula_browser.py src/msg/data/root-web-app.js src/msg/data/root-web-model.js src/msg/data/root-web-renderer.js src/msg/data/root-web.css src/msg/data/root-web.html src/msg/plugins/communication.py src/msg/plugins/discovery.py src/msg/plugins/star_projection.py src/msg/transports/universe.py tests/js/nebula.test.cjs tests/test_star_projection.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: refine post universe into token nebula'
          git push origin HEAD:main
