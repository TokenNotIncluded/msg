name: Apply migration contract compatibility
on:
  push:
    branches: [fix/issues-68-70-security-lifecycle]
    paths: [.github/workflows/apply-68-contracts.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply content-addressed compatibility patch
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = a2a1aaff47f2d02c7b79a6d706b3b7adefbbf674
          python3 - <<'PY'
          import base64,zlib,hashlib,pathlib
          data=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(data).hexdigest()=='fdec196c22669ce8c173877510c41579b34c35a0aa52dba60f9db707fab4da25'
          pathlib.Path('/tmp/68-contracts.patch').write_bytes(data)
          PY
          git apply --index /tmp/68-contracts.patch
          git rm .github/workflows/apply-68-contracts.yml
          test "$(git write-tree)" = 8b0527cacb7de85deb1d87eb2f0e9e8e5d1c3d84
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898285+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Version custodial extensions without changing published v1 contracts'
          git push origin HEAD:refs/heads/fix/issues-68-70-security-lifecycle
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Prepare public local test assets
        env:
          TIKTOKEN_CACHE_DIR: /tmp/msg-test-assets/tiktoken
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age git-lfs
          python -m pip install tiktoken
          python -c 'import tiktoken; tiktoken.get_encoding("cl100k_base")'
          cp /usr/bin/age-keygen /usr/bin/git-lfs /tmp/msg-test-assets/
          tar -C /tmp -czf /tmp/msg-test-assets.tar.gz msg-test-assets
      - uses: actions/upload-artifact@v4
        with:
          name: security-lifecycle-test-assets
          path: /tmp/msg-test-assets.tar.gz
          retention-days: 3
