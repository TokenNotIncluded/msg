name: Publish pinned executor patch
on:
  push:
    branches: [work/issue-workspace-20260929]
    paths: ['.publish/**', '.github/workflows/publish-executor.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Apply exactly the reviewed tree to a staging ref
        env:
          BASE: 453d6f858e19136261278c7042c13598035aef1a
          EXPECTED_TREE: e9e33a3286f6d4efd19a421834bba813448f6a79
          SCRIPT_HASH: 0077492ae73228daa08d1522c2d31014bd103c5f7129bd1b8d8c1046eca77d9e
        run: |
          set -euo pipefail
          echo "$SCRIPT_HASH  .publish/apply_executor.py" | sha256sum -c -
          cp .publish/apply_executor.py "$RUNNER_TEMP/apply_executor.py"
          git fetch --no-tags origin "$BASE"
          git checkout --detach "$BASE"
          test "$(git rev-parse HEAD^{tree})" = ae0b4f5e31dc1844c1abd0142da898b75b7779d4
          python "$RUNNER_TEMP/apply_executor.py"
          git add src tests/issue_78_80/conftest.py docs/ISSUE_PROGRESS.md
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git config user.name 'LIghtJUNction'
          git config user.email 'lightjunction.me@gmail.com'
          git commit -m 'refactor(core): isolate executor ports and shared wire contracts' -m 'Refs #156 #83 #85. Preserve canonical encodings, batch exclusions, transactional notifications and public import aliases.'
          git push origin HEAD:refs/heads/work/executor-core-staged-20260929-2045
          mkdir -p artifacts
          git show -s --format='%H%n%T%n%P%n%s' HEAD > artifacts/published.txt
      - uses: actions/upload-artifact@v4
        with:
          name: executor-published-source
          path: artifacts/published.txt
          if-no-files-found: error
