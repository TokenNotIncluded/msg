name: Security offline dependencies
on:
  push:
    branches: [workbench/security-142-source-20260928]
    paths: [.github/workflows/security-test-dependencies.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: cbc5741d45afccafca9f189f4cd27c3f94300b4e
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Download project-declared dependencies for offline tests
        run: |
          mkdir -p export/wheels export/debs
          python - <<'PY'
          import tomllib, pathlib, subprocess, sys
          p=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']
          subprocess.run([sys.executable,'-m','pip','download','--only-binary=:all:','-d','export/wheels',*p['dependencies'],*p['optional-dependencies']['dev']],check=True)
          PY
          docker run --rm -v "$PWD/export/debs:/out" debian:bookworm-slim sh -ec 'apt-get update -qq; apt-get -y --download-only install postgresql-15 age; cp /var/cache/apt/archives/*.deb /out/'
          find export -type f -print0 | sort -z | xargs -0 sha256sum > export/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: security-142-offline-dependencies
          path: export/
          retention-days: 1
