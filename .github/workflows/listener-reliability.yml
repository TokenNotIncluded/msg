name: Listener reliability
on:
  # Daily development is validated locally; retain an explicit reproduction job.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: listener-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgtest -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSG_BENCHMARK_OUTPUT: artifacts
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Record source for reproduction
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          git archive --format=tar.gz -o artifacts/source.tar.gz HEAD
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install smartcard build headers
        run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev pkg-config
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
      - name: Listener, local mailbox and private remote mailbox regressions
        run: >-
          uv run --locked --extra dev pytest
          tests/test_client_listener.py tests/test_client_subagents.py
          tests/test_client_subagents_remote.py tests/test_client_agent_cli.py
          tests/test_client_listener_reliability.py tests/test_client_listener_remote.py
          tests/test_client_listener_cli.py
          --junitxml=artifacts/listener.xml
      - name: Record bounded local measurements, not a harness ranking
        run: |
          git show 459f3f7be28eaa2f5639669d05add2a342bab20f:src/msg/client_listener.py > artifacts/baseline_listener.py
          uv run --locked --extra dev python scripts/benchmark_listener.py \
            --baseline-listener artifacts/baseline_listener.py \
            --revision "$(git rev-parse HEAD)" --trials 3 --tasks 8 --workers 4 \
            --poll-interval 0.1 --idle-seconds 0.4 --output artifacts/local-listener.json
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: listener-reliability-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
