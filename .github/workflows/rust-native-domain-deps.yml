name: Rust native domain dependencies
on:
  push:
    branches: ['migration/rust-*']
    paths: ['.github/workflows/rust-native-domain-deps.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve pinned public dependencies for the offline editor
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal
          mkdir -p /tmp/domain-deps/src /tmp/domain-deps/.cargo /tmp/domain-export
          cat > /tmp/domain-deps/Cargo.toml <<'TOML'
          [package]
          name="msg-domain-editor-dependencies"
          version="0.0.0"
          edition="2021"
          rust-version="1.85"
          [dependencies]
          roxmltree="=0.20.0"
          chrono-tz="=0.10.4"
          postgres-openssl="=0.5.2"
          ssh-key={version="=0.6.7",features=["crypto"]}
          openssl="=0.10.75"
          TOML
          printf '[resolver]\nincompatible-rust-versions="fallback"\n' > /tmp/domain-deps/.cargo/config.toml
          echo 'fn main() {}' > /tmp/domain-deps/src/main.rs
          (cd /tmp/domain-deps && cargo +1.85.0 vendor --versioned-dirs /tmp/domain-vendor > /tmp/domain-vendor-config.toml)
          cp /tmp/domain-deps/Cargo.toml /tmp/domain-deps/Cargo.lock /tmp/domain-export/
          tar -czf /tmp/domain-export/vendor.tar.gz -C /tmp domain-vendor domain-vendor-config.toml
          (cd /tmp/domain-export && sha256sum vendor.tar.gz Cargo.lock > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: msg-domain-editor-${{ github.sha }}
          path: /tmp/domain-export/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
