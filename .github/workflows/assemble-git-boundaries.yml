name: Assemble audited Git boundary extraction
on:
  push:
    branches: [build/git-boundaries-170]
    paths:
      - .github/tools/assemble_git_boundaries.py
      - .github/workflows/assemble-git-boundaries.yml
permissions:
  contents: write
  actions: write
jobs:
  assemble:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best' && github.ref == 'refs/heads/build/git-boundaries-170'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Avoid duplicate full validation of this source-only helper head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          gh api -X GET "repos/$REPO/actions/runs" -f head_sha="$INPUT_SHA" -f per_page=100 --jq '.workflow_runs[] | select(.path == ".github/workflows/ci.yml" and .event == "push" and .head_branch == "build/git-boundaries-170" and (.status == "queued" or .status == "in_progress")) | .id' |
          while read -r run; do
            gh api -X POST "repos/$REPO/actions/runs/$run/cancel" || true
          done
      - name: Require exact regression-first source
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$INPUT_SHA"
          git merge-base --is-ancestor ee26deca16978ac2e8e4b42095dc17cfe10c175f HEAD
          git diff --exit-code ee26deca16978ac2e8e4b42095dc17cfe10c175f -- src tests docs
      - name: Assemble and audit source without executing the project
        run: python .github/tools/assemble_git_boundaries.py
      - name: Commit only audited source and notes
        run: |
          git add src/msg/extensions/repositories.py src/msg/extensions/ssh_git.py src/msg/extensions/git_publication.py src/msg/transports/git_http.py src/msg/transports/http_common.py src/msg/transports/http_routes.py docs/GIT_BOUNDARY_PROGRESS.md
          git diff --cached --check
          python - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected=set(json.loads(Path('/tmp/git-boundary-assembly/audit.json').read_text())['changed_paths'])
          actual=set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual==expected,(actual-expected,expected-actual)
          PY
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'refactor(git): separate HTTP adaptation and share guarded publication'
      - name: Publish only the build branch without force
        env:
          INPUT_SHA: ${{ github.sha }}
        run: |
          test "$(git ls-remote origin refs/heads/build/git-boundaries-170 | cut -f1)" = "$INPUT_SHA"
          git push origin HEAD:refs/heads/build/git-boundaries-170
          python - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          git=lambda *args:subprocess.check_output(['git',*args],text=True).strip()
          Path('/tmp/git-boundary-assembly/source.json').write_text(json.dumps({
              'input':os.environ['INPUT_SHA'],'commit':git('rev-parse','HEAD'),
              'tree':git('rev-parse','HEAD^{tree}'),'dirty':bool(git('status','--porcelain'))},indent=2)+'\n')
          PY
          git archive --format=tar.gz -o /tmp/git-boundary-assembly/source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: git-boundary-assembly
          path: /tmp/git-boundary-assembly/
          if-no-files-found: error
