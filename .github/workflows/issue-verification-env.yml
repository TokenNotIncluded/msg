name: Issue verification environment
on:
  push:
    branches: ['fix/issues-74-76']
    paths: ['.github/workflows/issue-verification-env.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export immutable source snapshots
        run: |
          mkdir -p snapshots
          git archive --format=tar.gz --output=snapshots/main.tar.gz 2dd6a0d0260f8c230a1d5b2f4ff75241113835b2
          git archive --format=tar.gz --output=snapshots/market-pr102.tar.gz bfcf55d6567459c6a777cccaf9382eea316bd28c
          printf '%s\n' 'main 2dd6a0d0260f8c230a1d5b2f4ff75241113835b2' 'market-pr102 bfcf55d6567459c6a777cccaf9382eea316bd28c' > snapshots/commits.txt
          sha256sum snapshots/*.tar.gz > snapshots/checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pinned-source-review
          path: snapshots
          retention-days: 1
