name: Issue verification environment
on:
  push:
    branches: ['fix/issues-74-76']
    paths: ['.github/workflows/issue-verification-env.yml']
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Package PostgreSQL bootstrap catalog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-14
          mkdir -p portable
          cp -a /usr/share/postgresql/14 portable/share
          tar -czf verification-catalog.tar.gz portable
      - uses: actions/upload-artifact@v4
        with:
          name: issue-verification-catalog
          path: verification-catalog.tar.gz
          retention-days: 1
