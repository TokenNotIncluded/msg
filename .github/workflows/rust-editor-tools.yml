name: Rust offline editor tools
on:
  push:
    branches: ['migration/rust-*']
    paths: ['.github/workflows/rust-editor-tools.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Export only public compiler and repository source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.85.0 --profile minimal --component rustfmt,clippy
          mkdir -p /tmp/msg-editor-tools
          git rev-parse HEAD > /tmp/msg-editor-tools/source-commit.txt
          git rev-parse HEAD^{tree} > /tmp/msg-editor-tools/source-tree.txt
          git archive --format=tar.gz HEAD > /tmp/msg-editor-tools/source.tar.gz
          tar -cJf /tmp/msg-editor-tools/rust-toolchain.tar.xz -C "$HOME/.rustup/toolchains/1.85.0-x86_64-unknown-linux-gnu" .
          (cd /tmp/msg-editor-tools && sha256sum *.tar.* > SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: msg-editor-tools-${{ github.sha }}
          path: /tmp/msg-editor-tools/
          retention-days: 1
          if-no-files-found: error
          compression-level: 0
