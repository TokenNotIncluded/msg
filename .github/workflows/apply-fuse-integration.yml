name: Apply reviewed FUSE integration
on:
  push:
    branches: [work/fuse-mount-20261001]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'TokenNotIncluded/msg' && github.event.head_commit.message == 'build: stage FUSE integration for cloud verification'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Apply the reviewed local patch without replacing concurrent changes
        run: |
          git apply --check .fuse-integration.patch
          git apply .fuse-integration.patch
          sudo apt-get update -qq
          sudo env NEEDRESTART_MODE=l apt-get install -y -qq fuse3 libpcsclite-dev swig
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --extra fuse --python "$(command -v python)"
          .venv/bin/ruff check --fix src/msg/client_mount.py src/msg/cli.py src/msg/plugins/files.py tests/test_client_mount.py tests/test_mount_service.py scripts/check_fuse_mount.py
          .venv/bin/ruff format src/msg/client_mount.py src/msg/cli.py src/msg/plugins/files.py tests/test_client_mount.py tests/test_mount_service.py scripts/check_fuse_mount.py
      - name: Commit complete implementation and remove this one-off staging workflow
        run: |
          git rm .fuse-integration.patch .github/workflows/apply-fuse-integration.yml
          git add pyproject.toml uv.lock src/msg/client_mount.py src/msg/cli.py src/msg/plugins/files.py tests/test_client_mount.py tests/test_mount_service.py scripts/check_fuse_mount.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add authenticated read-only FUSE mounting'
          git push origin HEAD:refs/heads/work/fuse-mount-20261001
      - name: Test mount contracts on Python 3.15
        run: .venv/bin/python -m pytest tests/test_client_mount.py --junitxml=artifacts/fuse-unit.xml
      - name: Exercise actual Linux FUSE mount and cancellation
        run: .venv/bin/python scripts/check_fuse_mount.py
      - name: Export final reviewed delta
        if: always()
        run: |
          mkdir -p artifacts
          git diff c6be2080307a1a067c2117b9791e3a7a995a08de -- . ':!.fuse-integration.patch' ':!.github/workflows/apply-fuse-integration.yml' > artifacts/msg-fuse.patch
          git rev-parse HEAD > artifacts/commit.txt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: fuse-verification
          path: artifacts/
