name: Materialize reviewed hosting source
on:
  push:
    branches: ['ci/hosting-161-materialize-*']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Grant only reader-group traversal in the disposable fixture
        run: |
          set -eu
          git fetch origin b3bfdb51f54d6e0ee398fb7571444a22e2d71b2a
          git checkout --detach b3bfdb51f54d6e0ee398fb7571444a22e2d71b2a
          python - <<'PY'
          from pathlib import Path
          p=Path('tests/test_hosting_readonly_isolation.py')
          text=p.read_text()
          assert text.count('0o001')==2
          p.write_text(text.replace('0o001','0o010'))
          p=Path('deploy/HOSTING.md')
          text=p.read_text()
          assert text.count('` /@name/web/ `')==1
          p.write_text(text.replace('` /@name/web/ `','`/@name/web/`'))
          PY
          git diff --check
          git add tests/test_hosting_readonly_isolation.py deploy/HOSTING.md
          git config user.name 'msg maintenance CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: scope disposable reader traversal to its content group'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/ci/hosting-161-source-00ba8f7
          git log -1 --format='%H %T %P'
