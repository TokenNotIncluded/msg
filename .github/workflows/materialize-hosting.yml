name: Materialize reviewed hosting source
on:
  push:
    branches: ['ci/hosting-161-materialize-*']
permissions:
  contents: write
jobs:
  source:
    if: github.repository == 'TokenNotIncluded/msg.lmm.best'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Fix the verified PostgreSQL import without altering product CI
        run: |
          set -eu
          git fetch origin 0f0e13d1fe7d152a9034b4028ae2e1e7e2d06966
          git checkout --detach 0f0e13d1fe7d152a9034b4028ae2e1e7e2d06966
          echo '18ecf03d6566b811894865d8ff17c23bb653a87958b5b3d779e64eb6ba8f1ab2  src/msg/storage/postgres.py' | sha256sum --check
          sed -i 's/^from msg.core.errors import Failure$/from msg.core.errors import Failure, require/' src/msg/storage/postgres.py
          grep -Fx 'from msg.core.errors import Failure, require' src/msg/storage/postgres.py
          git diff --check
          git add src/msg/storage/postgres.py
          git config user.name 'msg maintenance CI'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: import the PostgreSQL read-only role guard'
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/ci/hosting-161-source-00ba8f7
          git log -1 --format='%H %T %P'
