name: Executor boundary
on:
  push:
    branches: ['fix/executor-boundary-*']
  pull_request:
    paths:
      - 'src/msg/core/**'
      - 'src/msg/application.py'
      - 'src/msg/plugins/batch.py'
      - 'src/msg/plugins/communication.py'
      - 'src/msg/extensions/ssh.py'
      - 'tests/test_executor_boundary.py'
      - '.github/workflows/executor-boundary.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: executor-boundary-${{ github.ref }}
  cancel-in-progress: true
jobs:
  assembly-and-transactions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U msgtest -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      valkey:
        image: valkey/valkey:9.0.6
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
      MSG_TEST_VALKEY_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip
      - name: Record tested source
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          pathlib.Path('artifacts/source.json').write_text(json.dumps({
              'commit': git('rev-parse', 'HEAD'), 'tree': git('rev-parse', 'HEAD^{tree}'),
              'run_id': os.environ['GITHUB_RUN_ID'], 'event': os.environ['GITHUB_EVENT_NAME'],
          }, indent=2) + '\n')
          PY
      - name: Install test prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age git-lfs
          python -m pip install -e '.[dev]'
      - name: Exercise assembly and unchanged security transaction contracts
        run: >-
          python -m pytest tests/test_executor_boundary.py tests/test_batch.py
          tests/test_batch_secret_release.py tests/test_webhook_domain_events.py
          tests/test_ssh_rss.py tests/test_security_transfer_rollback.py
          tests/test_service.py::test_requested_write_projection_is_returned_without_readback
          --junitxml=artifacts/executor-boundary.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: executor-boundary
          path: artifacts/
