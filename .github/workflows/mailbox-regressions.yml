name: Mailbox regressions
on:
  push:
    branches: ['fix/mailbox-client-*']
  pull_request:
    paths:
      - 'src/msg/plugins/mail_views.py'
      - 'src/msg/plugins/communication.py'
      - 'src/msg/client_subagents_remote.py'
      - 'tests/test_mailbox_contacts.py'
      - 'tests/test_todo_due_inbox.py'
      - 'tests/test_bounty.py'
      - 'tests/test_client_subagents_remote.py'
      - '.github/workflows/mailbox-regressions.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mailbox-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: msgtest
          POSTGRES_PASSWORD: msgtest
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U msgtest -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MSG_TEST_POSTGRES_URL_TEMPLATE: postgresql://msgtest:msgtest@127.0.0.1:5432/{database}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.12.20
          uv sync --locked --extra dev --python "$(command -v python)"
      - name: Record tested source
        run: |
          mkdir -p artifacts
          git rev-parse HEAD > artifacts/commit.txt
          git rev-parse HEAD^{tree} > artifacts/tree.txt
      - name: Check system notices, contact privacy and private agent queues
        run: >-
          uv run --locked --extra dev pytest
          tests/test_mailbox_contacts.py tests/test_todo_due_inbox.py
          tests/test_bounty.py tests/test_client_subagents_remote.py
          tests/test_tui_mailbox_selection.py tests/test_dm.py
          --junitxml=artifacts/mailbox.xml
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: mailbox-regressions
          path: artifacts/
          if-no-files-found: error
