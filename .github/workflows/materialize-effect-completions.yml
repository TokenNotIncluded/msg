name: Materialize reviewed completion fences
on:
  push:
    branches: [fix/85-all-effect-completions]
    paths: [.github/workflows/materialize-effect-completions.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/fix/85-all-effect-completions'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Apply checksum-verified changes and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p = Path('src/msg/workers/effects.py')
          s = p.read_text()
          assert sha256(p.read_bytes()).hexdigest() == 'cef18c5db5bcaf51ab60b65921f9ed055b9831f0fafdafe222fce0e5e11f37ce'
          start = s.index('    async def _live_attempt(self, tx, job):\n')
          end = s.index('    async def _finish(', start)
          s = s[:start] + s[end:]
          s = s.replace('from msg.security.network import intersect_policy', 'from msg.security.network import intersect_policy\nfrom msg.workers.leases import current_attempt')
          assert s.count('await self._live_attempt(tx, job)') == 2
          s = s.replace('await self._live_attempt(tx, job)', 'await current_attempt(self.app, tx, job)')
          s = s.replace('async def _finish(self, job, state, code):', 'async def _finish(self, job, state, code, *, status=None):')
          before = "            tx.set_setting('job_status:' + job.id, {'code': code})"
          assert s.count(before) == 1
          s = s.replace(before, "            tx.set_setting('job_status:' + job.id,\n                           {'code': code} if status is None else status)")
          before = "                current = await tx.job(job.id)\n                require(current.state == 'running' and current.attempts == job.attempts, 'job_lease_lost')"
          assert s.count(before) == 1
          s = s.replace(before, '                current = await current_attempt(self.app, tx, job)\n                if current is None:\n                    return')
          before = "                await self._finish(job,'done','ok')\n                async with self.app.metadata.transaction(write=True) as tx:\n                    tx.set_setting('job_status:'+job.id,result)"
          assert s.count(before) == 1
          s = s.replace(before, "                await self._finish(job,'done','ok',status=result)")
          assert sha256(s.encode()).hexdigest() == '2c97da79e8b024b6ad1f7453851fe698ca11942afef5ad1a4d46f4aa391886ea'
          p.write_text(s)
          p = Path('src/msg/extensions/repositories.py')
          s = p.read_text()
          assert sha256(p.read_bytes()).hexdigest() == 'e67f3aaf918f4427d9f6d33df9ef7bfe3bdd83b6768023463f7f185e42f91483'
          before = '    from msg.workers.effects import current_principal,worker_context,effect_request'
          assert s.count(before) == 1
          s = s.replace(before, before + '\n    from msg.workers.leases import current_attempt')
          before = "                current=await tx.job(job.id)\n                require(current.state=='running' and current.attempts==job.attempts,'job_lease_lost')"
          assert s.count(before) == 1
          s = s.replace(before, '                current=await current_attempt(app,tx,job)\n                if current is None:\n                    return')
          assert sha256(s.encode()).hexdigest() == '75c5d826ab4c6e8742b90a7ce033152e85aa2eb24e72bc7cac3edde0034e63c2'
          p.write_text(s)
          PY
          python -m py_compile src/msg/workers/effects.py src/msg/workers/leases.py src/msg/extensions/repositories.py
          git diff --check
          git add src/msg/workers/effects.py src/msg/extensions/repositories.py
          git rm .github/workflows/materialize-effect-completions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(effects): fence tool, Git and maintenance completions consistently'
          git push origin HEAD:refs/heads/fix/85-all-effect-completions
