name: Security lifecycle verification tools
on:
  push:
    branches: [fix/issues-68-70-security-lifecycle]
    paths: [.github/workflows/security-lifecycle-tools.yml]
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Prepare public code and local-only test dependencies
        run: |
          set -eu
          sudo apt-get update -qq
          sudo apt-get install -y -qq age nginx postgresql-16
          python -m pip install '.[dev]' setuptools
          mkdir -p tools/runtime/lib tools/runtime/bin tools/runtime/postgres tools/artifacts
          git archive HEAD > tools/source.tar
          git rev-parse HEAD > tools/source.sha
          git fetch --depth=1 origin ac083b3666b1b5268d90115129e2cc4e0dd11521
          git archive FETCH_HEAD > tools/legacy.tar
          prefix=$(python -c 'import sys;print(sys.base_prefix)')
          cp -a "$prefix" tools/runtime/python
          cp -a /usr/lib/postgresql/16/bin tools/runtime/postgres/
          cp -a /usr/lib/postgresql/16/lib tools/runtime/postgres/
          cp -a /usr/share/postgresql/16 tools/runtime/postgres/share
          cp -L /usr/bin/age /usr/sbin/nginx /usr/bin/openssl tools/runtime/bin/
          docker pull valkey/valkey:9.0.6
          id=$(docker create valkey/valkey:9.0.6)
          docker cp "$id":/usr/local/bin/valkey-server tools/runtime/bin/valkey-server
          docker rm "$id"
          python - <<'PY'
          import pathlib, subprocess, shutil
          root=pathlib.Path('tools/runtime')
          todo=[p for p in root.rglob('*') if p.is_file() and not p.is_symlink()]
          seen=set()
          while todo:
              p=todo.pop()
              try:
                  with p.open('rb') as stream:
                      if stream.read(4)!=b'\x7fELF': continue
                  text=subprocess.run(['ldd',str(p)],capture_output=True,text=True).stdout
              except (OSError,UnicodeError): continue
              for line in text.splitlines():
                  for word in line.split():
                      if not word.startswith('/') or word in seen: continue
                      seen.add(word)
                      source=pathlib.Path(word)
                      if not source.is_file() or source.name.startswith('ld-linux'): continue
                      target=root/'lib'/source.name
                      if not target.exists():
                          shutil.copyfile(source,target)
                          todo.append(target)
          PY
          tar -C tools -czf tools/artifacts/verification-runtime.tar.gz runtime source.tar source.sha legacy.tar
          sha256sum tools/artifacts/verification-runtime.tar.gz > tools/artifacts/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: security-lifecycle-local-runtime
          path: tools/artifacts/
          retention-days: 3
