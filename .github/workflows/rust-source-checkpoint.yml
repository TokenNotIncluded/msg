name: Rust content commit preparation
on:
  push:
    branches: ['migration/rust-wire-phase1']
    paths: ['.github/workflows/rust-source-checkpoint.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'TokenNotIncluded/msg' && github.ref == 'refs/heads/migration/rust-wire-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
