          hashes = ['e655621583054d8df50323e12ab1a5026745f70e35dfb63c3450a248a6a3dc4c', '68e080ebd4659f50c106996edd16929ee48f8631b09741071d766d201827e2ae', 'e61c927771aa4bbd6c0eddafc3728c72c3d6c0f145637b1ec39fc670cd06d9a4', '6c3477b298fa3bd7de947e938717ca801abc95701c7d5cf042249e0d88f71951']
          for i, (part, digest) in enumerate(zip(parts, hashes, strict=True)):
              assert hashlib.sha256(part.encode()).hexdigest() == digest, f'payload chunk {i}'
          patch = lzma.decompress(base64.b85decode(''.join(parts)))
          assert len(patch) == 87649 and hashlib.sha256(patch).hexdigest() == patch_digest
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == parent
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=patch, check=True)
          checkpoint = '.github/workflows/rust-source-checkpoint.yml'
          subprocess.run(['git', 'rm', '--', checkpoint], check=True)
          allowed = set('''.github/workflows/rust-wire.yml
          rust/Cargo.lock
          rust/MIGRATION.md
          rust/README.md
          rust/crates/msg-storage/Cargo.toml
          rust/crates/msg-storage/examples/content_check.rs
          rust/crates/msg-storage/src/content/files.rs
          rust/crates/msg-storage/src/content/git.rs
          rust/crates/msg-storage/src/content/mod.rs
          rust/crates/msg-storage/src/content/tests.rs
          rust/crates/msg-storage/src/lib.rs
          rust/tests/test_content_parity.py'''.splitlines())
          assert set(git('diff', '--cached', '--name-only').splitlines()) == allowed | {checkpoint}
          assert git('write-tree') == expected_tree, 'tested source tree mismatch'
          def api(path, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['API_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'msg-content-preparation'},
                  method='GET' if data is None else 'POST')
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)
          assert api('/git/ref/heads/migration/rust-wire-phase1')['object']['sha'] == parent
          entries = [{'path': path, 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(path).read_text()} for path in sorted(allowed)]
          entries.append({'path': checkpoint, 'mode': '100644', 'type': 'blob', 'sha': None})
          tree = api('/git/trees', {'base_tree': git('rev-parse', 'HEAD^{tree}'), 'tree': entries})
          assert tree['sha'] == expected_tree
          commit = api('/git/commits', {'message': 'feat(rust): add verified native Git/blob content storage', 'tree': expected_tree, 'parents': [parent]})
          receipt = {'parent_sha': parent, 'tree_sha': expected_tree, 'commit_sha': commit['sha'], 'patch_sha256': patch_digest, 'refs_updated': False}
          destination = pathlib.Path('/tmp/msg-prepared')
          destination.mkdir()
          (destination / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: msg-rust-content-prepared
          path: /tmp/msg-prepared/receipt.json
          retention-days: 2
          if-no-files-found: error
