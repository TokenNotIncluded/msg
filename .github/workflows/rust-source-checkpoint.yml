name: Rust content source preparation
on:
  push:
    branches: ['migration/rust-wire-phase1']
    paths: ['.github/workflows/rust-source-checkpoint.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'TokenNotIncluded/msg' && github.ref == 'refs/heads/migration/rust-wire-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Prepare Rust subtree only, without workflows or ref updates
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          ACTUAL_BEFORE: ${{ github.event.before }}
          API_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import ast, base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.error, urllib.request
          repo = os.environ['REPOSITORY']
          parent = os.environ['EVENT_SHA']
          payload_commit = '17f378cee9693f660a4a9c96e05e4ff832aa923b'
          assert repo == 'TokenNotIncluded/msg'
          assert os.environ['ACTUAL_BEFORE'] == payload_commit
          expected_tree = '94c6c50eddeaa0c37bcd416417323c1eea8877f3'
          expected_rust = '13f795c809c1b328775ca010e5f34cd78348cd13'
          patch_digest = '2d82567ddbad9e8ebf7ca424928a3815e167eda6319fc687eabfaf56fbbac7bf'
          checkpoint = '.github/workflows/rust-source-checkpoint.yml'
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          assert git('rev-parse', 'HEAD') == parent
          source = git('show', payload_commit + ':' + checkpoint)
          # Parse only a literal data list; never execute the earlier script.
          encoded = source.split('          parts = [\n', 1)[1].split('\n          ]', 1)[0]
          parts = ast.literal_eval('[\n' + encoded + '\n]')
          assert len(parts) == 4 and all(isinstance(part, str) for part in parts)
          patch = lzma.decompress(base64.b85decode(''.join(parts)))
          assert len(patch) == 87649 and hashlib.sha256(patch).hexdigest() == patch_digest
          subprocess.run(['git', 'apply', '--index', '--binary', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '--', checkpoint], check=True)
          allowed = set('''rust/Cargo.lock
          rust/MIGRATION.md
          rust/README.md
          rust/crates/msg-storage/Cargo.toml
          rust/crates/msg-storage/examples/content_check.rs
          rust/crates/msg-storage/src/content/files.rs
          rust/crates/msg-storage/src/content/git.rs
          rust/crates/msg-storage/src/content/mod.rs
          rust/crates/msg-storage/src/content/tests.rs
          rust/crates/msg-storage/src/lib.rs
          rust/tests/test_content_parity.py'''.splitlines())
          assert set(git('diff', '--cached', '--name-only').splitlines()) == allowed | {checkpoint, '.github/workflows/rust-wire.yml'}
          assert git('write-tree') == expected_tree, 'tested source tree mismatch'
          assert git('rev-parse', expected_tree + ':rust') == expected_rust
          def api(path, data=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['API_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json', 'User-Agent': 'msg-content-preparation'},
                  method='GET' if data is None else 'POST')
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  print(error.code, error.read(4096).decode(errors='replace'))
                  raise
          assert api('/git/ref/heads/migration/rust-wire-phase1')['object']['sha'] == parent
          entries = [{'path': path.removeprefix('rust/'), 'mode': '100644', 'type': 'blob', 'content': pathlib.Path(path).read_text()} for path in sorted(allowed)]
          # Actions may write source objects, not workflow files. The authorized
          # repository connector will separately compose the final root tree.
          tree = api('/git/trees', {'base_tree': git('rev-parse', 'HEAD:rust'), 'tree': entries})
          assert tree['sha'] == expected_rust
          receipt = {'parent_sha': parent, 'base_tree_sha': git('rev-parse', 'HEAD^{tree}'), 'rust_tree_sha': expected_rust, 'final_tree_sha': expected_tree, 'patch_sha256': patch_digest, 'refs_updated': False}
          destination = pathlib.Path('/tmp/msg-prepared')
          destination.mkdir()
          (destination / 'receipt.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: msg-rust-content-prepared
          path: /tmp/msg-prepared/receipt.json
          retention-days: 2
          if-no-files-found: error
