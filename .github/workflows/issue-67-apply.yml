name: Apply locally verified issue 67 patch
on:
  push:
    branches: [fix/issue-67-durable-token-delivery]
    paths: [.github/workflows/issue-67-apply.yml]
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-67-durable-token-delivery
          fetch-depth: 2
      - name: Check exact base and apply content-addressed local patch
        env:
          PATCH_DATA: |
            
            
            
        run: |
          set -eu
          test "$(git rev-parse HEAD^)" = 99fb4f3ef9a935dab39913fcab981eda5f533443
          python - <<'PY'
          import base64, gzip, hashlib, os, pathlib
          raw = gzip.decompress(base64.b64decode(''.join(os.environ['PATCH_DATA'].split()), validate=True))
          assert len(raw) == 57267
          assert hashlib.sha256(raw).hexdigest() == '0de6c4e1f628423a4891c6e0547eac373c8d6a892dcafd250095f3bbbbd4f691'
          pathlib.Path('/tmp/issue67.patch').write_bytes(raw)
          PY
          git apply --check /tmp/issue67.patch
          git apply /tmp/issue67.patch
          git diff --check
          rm .github/workflows/issue-67-apply.yml
          git add docs/CREDENTIAL_DELIVERY.md src/msg/admin/diagnostics.py src/msg/admin/token_delivery_check.py src/msg/application.py src/msg/client.py src/msg/client_tokens.py src/msg/data/bootstrap.json src/msg/plugins/batch.py src/msg/transports/packet.py tests/test_credential_delivery_contract.py tests/test_credential_delivery_matrix.py .github/workflows/issue-67-apply.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix durable one-use credential recovery and preserve nonsecret receipts' -m 'Refs #67. Local focused regression: 123 passed. Full final-head CI remains required before merge. No production changes. Remove temporary patch staging workflow.'
          git push origin HEAD:refs/heads/fix/issue-67-durable-token-delivery
  local-test-tool:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export only the public Valkey binary used by repository CI
        run: |
          set -eu
          mkdir -p tools
          docker pull valkey/valkey:9.0.6
          id=$(docker create valkey/valkey:9.0.6)
          trap 'docker rm "$id"' EXIT
          docker cp "$id":/usr/local/bin/valkey-server tools/valkey-server
          sha256sum tools/valkey-server > tools/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: issue67-local-valkey
          path: tools/
          retention-days: 3
