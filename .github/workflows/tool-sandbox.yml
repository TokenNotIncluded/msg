name: Real tool sandbox
on:
  push:
    paths:
      - '.github/workflows/tool-sandbox.yml'
      - 'scripts/check_tool_sandbox.py'
      - 'src/msg/workers/sandbox.py'
      - 'tests/test_tool_sandbox_acceptance.py'
  pull_request:
    paths:
      - '.github/workflows/tool-sandbox.yml'
      - 'scripts/check_tool_sandbox.py'
      - 'src/msg/workers/sandbox.py'
      - 'tests/test_tool_sandbox_acceptance.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Install sandbox and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bubblewrap apparmor-profiles
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          python -m pip install -e '.[dev]'
      - name: Check real child startup before acceptance
        run: |
          bwrap --version
          ldd "$(command -v python)"
          python scripts/check_tool_sandbox.py
      - name: Exercise real isolation and bounded local network access
        run: python -m pytest tests/test_tool_sandbox_acceptance.py -q
