name: Auxiliary security review source publication
on:
  push:
    branches: [chore/security-review-transport-69befd0]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIOR: 41bb241ef21793b6f951714dbca266bcf67386ef
      MAIN: e94202899ab48399a586b0c613a1b817f9783d58
      EXPECTED_TREE: d3f0250b9ed9ffe3ebb3ad55a4db94b2f4e553d6
      TARGET: fix/security-pr-review-20260928-69befd0
      STAGING: chore/security-integration-e942-d3f0250
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 41bb241ef21793b6f951714dbca266bcf67386ef
          fetch-depth: 0
      - name: Reproduce the reviewed three-way merge and verify the complete tree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PRIOR"
          test "$(git ls-remote --heads origin "refs/heads/$TARGET" | cut -f1)" = "$PRIOR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff "$MAIN"
          test "$(git write-tree)" = "$EXPECTED_TREE"
          git diff --cached --check
          git commit -m 'Merge current main into security repairs without dropping account-scope protections' -m 'Preserve both parents and all main changes. Complete tree d3f0250b9ed9ffe3ebb3ad55a4db94b2f4e553d6 independently reconstructed locally from the main CI source artifact and unchanged document blob identities. Only the security repair delta remains relative to e942028. Product target-runtime CI and review remain required; no production access or main merge.'
      - name: Stage immutable source only; a connector updates the PR ref separately
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          if git ls-remote --heads origin "refs/heads/$STAGING" | grep -q .; then
            echo 'Refusing to overwrite an existing staging branch' >&2
            exit 1
          fi
          git push origin "HEAD:refs/heads/$STAGING"
          mkdir -p /tmp/security-publication
          git rev-parse HEAD HEAD^{tree} > /tmp/security-publication/revision.txt
          git diff "$MAIN" HEAD --stat > /tmp/security-publication/stat.txt
          git diff --binary "$MAIN" HEAD > /tmp/security-publication/security.patch
          cat /tmp/security-publication/revision.txt >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: security-source-publication
          path: /tmp/security-publication/
          retention-days: 3
