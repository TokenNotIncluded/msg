name: Import verified Rust checkpoint
on:
  push:
    branches: ['migration/rust-wire-phase1']
    paths: ['.github/workflows/rust-phase4-import.yml']
permissions:
  contents: write
concurrency:
  group: msg-rust-checkpoint-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'TokenNotIncluded/msg' && github.ref == 'refs/heads/migration/rust-wire-phase1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact source, apply Rust-only patch, and publish without force
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          import lzma
          import os
          import pathlib
          import subprocess
          import urllib.request

          repo = 'TokenNotIncluded/msg'
          branch = 'migration/rust-wire-phase1'
          blobs = [
              ('f7075d03c96731f0555c2b341ddf89a13801311c', 16000),
              ('85578e5f30d48f7623abfa0bc107d2989ac7965e', 16000),
              ('2e9c61ba133df50aaff5faac80efbe0f9c4705e7', 16000),
              ('4c33f5f5f3446167ca2dde2d10a82c4cd54a5eb9', 16000),
              ('1dc1a240972e2db80898b2c6fe3519858ff6e5d7', 264),
          ]
          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()
          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)
          require(git('rev-parse', 'HEAD') == os.environ['EXPECTED_HEAD'], 'head mismatch')
          require(git('rev-parse', 'HEAD:rust') == 'd83f9d6c9e837ba8ccb78c226122874b23bce520', 'Rust baseline changed')
          require(not git('status', '--porcelain'), 'worktree is not clean')
          chunks = []
          for sha, size in blobs:
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/git/blobs/{sha}',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  record = json.loads(response.read(100000))
              require(record['sha'] == sha and record['size'] == size, 'blob metadata mismatch')
              content = base64.b64decode(record['content'].replace('\n', ''), validate=True)
              require(len(content) == size, 'chunk size mismatch')
              require(hashlib.sha1(b'blob ' + str(size).encode() + b'\0' + content).hexdigest() == sha, 'blob digest mismatch')
              chunks.append(content)
          packed = base64.b64decode(b''.join(chunks), validate=True)
          require(hashlib.sha256(packed).hexdigest() == '2e57559abcdbbb2fe56791880f9db034a853aec4306acd7f9b0ad1ac455b9117', 'archive digest mismatch')
          decoder = lzma.LZMADecompressor(memlimit=134217728)
          patch = decoder.decompress(packed, max_length=250448)
          require(decoder.eof and not decoder.unused_data and len(patch) == 250447, 'patch size or format mismatch')
          require(hashlib.sha256(patch).hexdigest() == '84a79dc86f1fb725c316f4d2139c93e5eaa1d70e81b8b543812c10d385ca9011', 'patch digest mismatch')
          path = pathlib.Path('/tmp/msg-verified-rust.patch')
          path.write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '--index', str(path)], check=True)
          subprocess.run(['git', 'apply', '--index', str(path)], check=True)
          changed = git('diff', '--cached', '--name-only').splitlines()
          require(changed and all(p.startswith('rust/') and '..' not in p.split('/') for p in changed), 'non-Rust path rejected')
          tree = git('write-tree')
          require(git('rev-parse', tree + ':rust') == 'c0901a33e6cb0ba22126540be4b2a2fb667ac0a8', 'resulting Rust tree mismatch')
          git('config', 'user.name', 'github-actions[bot]')
          git('config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          git('commit', '-m', 'feat(rust): enforce resource policy and native PostgreSQL transactions')
          header = 'AUTHORIZATION: basic ' + base64.b64encode(('x-access-token:' + os.environ['GH_TOKEN']).encode()).decode()
          env = dict(os.environ)
          env.update(GIT_CONFIG_COUNT='1', GIT_CONFIG_KEY_0='http.https://github.com/.extraheader', GIT_CONFIG_VALUE_0=header)
          remote = subprocess.check_output(['git', 'ls-remote', 'origin', 'refs/heads/' + branch], env=env, text=True).split()[0]
          require(remote == os.environ['EXPECTED_HEAD'], 'branch advanced; refusing to overwrite')
          subprocess.run(['git', 'push', 'origin', 'HEAD:refs/heads/' + branch], env=env, check=True)
          out = pathlib.Path('/tmp/msg-rust-checkpoint')
          out.mkdir()
          metadata = {'source_commit': git('rev-parse', 'HEAD'), 'source_tree': git('rev-parse', 'HEAD^{tree}'),
                      'rust_tree': git('rev-parse', 'HEAD:rust'), 'patch_sha256': hashlib.sha256(patch).hexdigest(),
                      'files': changed, 'note': 'Import evidence only; independent CI has not run on this commit.'}
          (out / 'metadata.json').write_text(json.dumps(metadata, indent=2) + '\n')
          (out / 'Cargo.lock').write_bytes(pathlib.Path('rust/Cargo.lock').read_bytes())
          with (out / 'source.tar.gz').open('wb') as archive:
              subprocess.run(['git', 'archive', '--format=tar.gz', 'HEAD'], stdout=archive, check=True)
          print(json.dumps(metadata, indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: msg-rust-phase4-import
          path: /tmp/msg-rust-checkpoint/
          retention-days: 7
          if-no-files-found: error
