name: Materialize reviewed lease fix
on:
  push:
    branches: [fix/81-expired-effect-leases]
    paths: [.github/workflows/materialize-81-lease-fix.yml]
permissions:
  contents: write
jobs:
  materialize:
    if: github.ref == 'refs/heads/fix/81-expired-effect-leases'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - name: Apply the exact locally tested patch and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p = Path("src/msg/workers/effects.py")
          s = p.read_text()
          assert sha256(p.read_bytes()).hexdigest() == "920d79bb983321fb385428b2d5a0f7240c641f4b289a49a1a25e5657bcd3f3c2"
          changes = [("            current = await tx.job(job.id)\n            # A different process may have expired this lease. Never overwrite its\n            # uncertainty with a late result from the old lease holder.\n            if current.state != 'running' or current.attempts != job.attempts:\n                return", '            current = await self._live_attempt(tx, job)\n            if current is None:\n                return'), ("            current = await tx.job(job.id)\n            if current.state != 'running' or current.attempts != job.attempts:\n                return", '            current = await self._live_attempt(tx, job)\n            if current is None:\n                return'), ('    async def _finish(self, job, state, code):\n', '    async def _live_attempt(self, tx, job):\n        """Fence completions even when no other worker has swept expired leases."""\n        current = await tx.job(job.id)\n        if current.state != \'running\' or current.attempts != job.attempts:\n            return None\n        if current.lease_until is None or current.lease_until <= self.app.clock():\n            await tx.save_job(replace(current, state=\'uncertain\', lease_until=None))\n            tx.set_setting(\'job_status:\' + job.id, {\'code\': \'expired_execution_lease\'})\n            return None\n        return current\n\n    async def _finish(self, job, state, code):\n')]
          for before, after in changes:
              assert s.count(before) == 1
              s = s.replace(before, after)
          assert sha256(s.encode()).hexdigest() == "cef18c5db5bcaf51ab60b65921f9ed055b9831f0fafdafe222fce0e5e11f37ce"
          p.write_text(s)
          PY
          python -m py_compile src/msg/workers/effects.py
          git diff --check
          git add src/msg/workers/effects.py
          git rm .github/workflows/materialize-81-lease-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(effects): fence expired completions and retries without a sweep'
          git push origin HEAD:refs/heads/fix/81-expired-effect-leases
