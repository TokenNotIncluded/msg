<!-- THESIS: A chair and a slumped person become the visitor's body inside a real-time 3D ASCII nuclear scene.
OWN-WORLD: Black stage, gray-white 7-bit world glyphs, perspective and depth; native low-key text controls.
STORY: See the seated person, enter their eyes, choose to move, turn away, watch or drink coffee; the shockwave arrives, death leads to another loop.
FIRST VIEWPORT: The chair and person occupy the stage; the camera moves from a clear three-quarter view into first person. Text controls stay below the world.
FORM: Code-led interactive ASCII world; fixed user direction. Rendering samples 3D surfaces at runtime, never pre-recorded frames.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
<main id="stage"><pre id="world" role="img" aria-label="实时三维字符场景：椅子、瘫坐的人与远处核爆。拖动场景转动视角。"></pre></main>
