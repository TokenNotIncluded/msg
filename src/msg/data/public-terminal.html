<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Public terminal · msg</title>
<style>
:root { color-scheme:dark; font:14px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace; color:#e7e7e7; background:#000; }
* { box-sizing:border-box; }
body { margin:0; padding:32px 24px; }
main { max-width:900px; margin:auto; }
header { display:flex; gap:24px; align-items:baseline; justify-content:space-between; border-bottom:1px solid #303030; padding-bottom:16px; margin-bottom:28px; }
h1 { font:inherit; margin:0; }
a { color:#aaa; text-underline-offset:4px; }
a:hover { color:#fff; }
p { color:#aaa; margin:0 0 24px; }
pre { font:inherit; white-space:pre-wrap; overflow-wrap:anywhere; margin:0 0 24px; }
.command { color:#aaa; margin-bottom:4px; }
.error { color:#ffb4aa; }
form { display:flex; align-items:center; gap:12px; padding:8px 0; }
label { flex:none; }
input { min-width:0; flex:1; border:0; background:transparent; color:inherit; font:inherit; padding:8px 0; caret-color:#fff; border-radius:0; }
input:focus-visible { outline:none; box-shadow:0 1px #aaa; }
input:disabled { color:#aaa; }
input::placeholder { color:#aaa; }
button { font:inherit; color:#aaa; background:none; border:1px solid #454545; padding:8px 12px; cursor:pointer; }
button:hover { color:#fff; border-color:#aaa; }
button:disabled { cursor:wait; color:#aaa; }
a:focus-visible,button:focus-visible { outline:2px solid #e7e7e7; outline-offset:4px; }
::selection { background:#e7e7e7; color:#000; }
html { scrollbar-color:#555 #000; }
#status { display:block; color:#aaa; min-height:24px; }
@media(max-width:540px) { body { padding:20px 16px; } header { gap:16px; } }
</style>
<body>
<!-- THESIS: One public prompt, fixed read commands.
OWN-WORLD: Existing black canvas, gray text, monospace transcript, no panels.
STORY: Read help, type a command, inspect real anonymous service data.
FIRST VIEWPORT: Small title and home link, help transcript, full-width prompt.
FORM: Brief-pinned minimal terminal; code-led, no concept seed required.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance -->
<main>
<header><h1>Public terminal</h1><a href="/">msg / home</a></header>
<p>Read-only. Type <strong>help</strong> for commands.</p>
<section id="transcript" role="log" aria-label="Terminal output" aria-live="polite" aria-relevant="additions"></section>
<form id="prompt">
<label for="command">msg &gt;</label>
<input id="command" name="command" aria-label="Command" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="32" placeholder="help" autofocus>
<button id="run" type="submit">Run</button>
</form>
<span id="status" role="status"></span>
<noscript>This terminal needs JavaScript. Read the <a href="/">public home page</a>.</noscript>
</main>
<script>
(() => {
  const transcript = document.querySelector('#transcript');
  const form = document.querySelector('#prompt');
  const input = document.querySelector('#command');
  const run = document.querySelector('#run');
  const status = document.querySelector('#status');
  const commands = ['help', 'status', 'time', 'server', 'stats', 'feed', 'clear'];
  const history = [];
  let cursor = 0;
  let draft = '';
  function append(text, className = '') {
    const line = document.createElement('pre');
    line.textContent = text;
    line.className = className;
    transcript.append(line);
    while (transcript.children.length > 160) transcript.firstElementChild.remove();
  }
  append('help     Show available commands\nstatus   Service readiness\ntime     Server time (UTC)\nserver   Public service address\nstats    Public post and user counts\nfeed     Latest public posts\nclear    Clear this screen');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    if (input.disabled) return;
    const command = input.value.trim();
    if (!command) return;
    history.push(command);
    if (history.length > 100) history.shift();
    cursor = history.length;
    draft = '';
    input.value = '';
    if (command === 'clear') { transcript.replaceChildren(); return; }
    append('msg > ' + command, 'command');
    if (!commands.includes(command)) {
      append('Unknown command. Type help.', 'error');
      return;
    }
    input.disabled = run.disabled = true;
    status.textContent = 'Reading…';
    try {
      const response = await fetch('/_terminal?command=' + encodeURIComponent(command), {
        credentials:'omit', cache:'no-store', signal:AbortSignal.timeout(15000)
      });
      if (!response.ok) throw new Error('unavailable');
      const data = await response.json();
      if (typeof data.output !== 'string') throw new Error('invalid response');
      append(data.output);
    } catch {
      append('Could not read the server. Run the command again.', 'error');
    } finally {
      input.disabled = run.disabled = false;
      status.textContent = '';
      input.focus({preventScroll:true});
      form.scrollIntoView({block:'nearest'});
    }
  });
  input.addEventListener('keydown', event => {
    if (event.key === 'ArrowUp' || event.key === 'ArrowDown') {
      event.preventDefault();
      if (cursor === history.length) draft = input.value;
      cursor = Math.max(0, Math.min(history.length, cursor + (event.key === 'ArrowUp' ? -1 : 1)));
      input.value = cursor === history.length ? draft : history[cursor];
    } else if (event.key === 'Tab') {
      const matches = commands.filter(command => command.startsWith(input.value));
      if (input.value && matches.length === 1) { event.preventDefault(); input.value = matches[0]; }
    } else if (event.ctrlKey && event.key.toLowerCase() === 'l') {
      event.preventDefault(); transcript.replaceChildren();
    }
  });
})();
</script>
</body>
</html>
