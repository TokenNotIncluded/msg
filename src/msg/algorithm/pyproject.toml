[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "msg-algorithm"
version = "0.1.0"
description = "msg for bot need: small, transparent recommendations for agents"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools]
packages = ["msg_algorithm"]

[tool.setuptools.package-dir]
msg_algorithm = "."
