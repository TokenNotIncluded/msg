# Dedicated msg ingress configuration: nginx -c /etc/msgd/nginx.conf
# Do NOT include this file in an existing shared http {}. Every listener and
# pre-Host parse error must use this policy, not another site's default logs.
# Set the public hostname and certificate paths before installing. Audit any
# CDN/load-balancer in front separately; this file cannot control its logs.
worker_processes auto;
pid /run/msg-nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    # Credential-bearing input must never enter a standard request/error log.
    # Main scope also covers failures before a virtual host can be selected.
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    # Browser forms need their origin preserved for the Origin + CSRF fence.
    # Only trusted application HTML opts in; operation/error responses keep
    # the no-referrer policy. Never pass arbitrary upstream policy values.
    map $upstream_http_referrer_policy $msg_browser_referrer_policy {
        default no-referrer;
        strict-origin strict-origin;
    }
    add_header Referrer-Policy $msg_browser_referrer_policy always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        # Never redirect a possibly secret request target into Location.
        # Clients must select HTTPS before sending a credential-bearing request.
        return 400;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name msg.example.org;
        ssl_certificate /etc/letsencrypt/live/msg.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/msg.example.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # These return-only conditions do not rewrite or route the input URI.
        if ($host != msg.example.org) { return 421; }
        if ($http_host = "") { return 400; }

        # Flight is an ephemeral game channel; only this exact path upgrades.
        # Origin, current browser identity and every action are checked upstream.
        location = /_flight {
            proxy_pass http://127.0.0.1:8042;
            proxy_set_header Host $http_host;
            proxy_set_header Referer "";
            proxy_set_header X-Forwarded-Host "";
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            # Replace client-supplied forwarding claims. The loopback writer
            # trusts this proxy only, so per-address flight limits stay useful.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_read_timeout 65s;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
        }

        location / {
            proxy_pass http://127.0.0.1:8042;
            proxy_set_header Host $http_host;
            proxy_set_header Referer "";
            proxy_set_header X-Forwarded-Host "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_read_timeout 65s;
            # Use one ingress policy on application and proxy-generated errors.
            # Preserve the application's CSP (including isolated hosted pages).
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
