# Dedicated msg ingress configuration: nginx -c /etc/msgd/nginx.conf
# Do NOT include this file in an existing shared http {}. Every listener and
# pre-Host parse error must use this policy, not another site's default logs.
# Set the public hostname and certificate paths before installing. Audit any
# CDN/load-balancer in front separately; this file cannot control its logs.
worker_processes auto;
pid /run/msg-nginx.pid;
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    # Credential-bearing input must never enter a standard request/error log.
    # Main scope also covers failures before a virtual host can be selected.
    access_log off;
    error_log /dev/null crit;
    server_tokens off;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;

    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    add_header X-Content-Type-Options nosniff always;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        # Never redirect a possibly secret request target into Location.
        # Clients must select HTTPS before sending a credential-bearing request.
        return 400;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name msg.example.org;
        ssl_certificate /etc/letsencrypt/live/msg.example.org/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/msg.example.org/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # These return-only conditions do not rewrite or route the input URI.
        if ($host != msg.example.org) { return 421; }
        if ($http_host = "") { return 400; }

        location / {
            proxy_pass http://127.0.0.1:8042;
            proxy_set_header Host $http_host;
            proxy_set_header Referer "";
            proxy_set_header X-Forwarded-Host "";
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_redirect off;
            proxy_read_timeout 65s;
            # Use one ingress policy on application and proxy-generated errors.
            # Preserve the application's CSP (including isolated hosted pages).
            proxy_hide_header Referrer-Policy;
            proxy_hide_header Cache-Control;
            proxy_hide_header X-Content-Type-Options;
        }
    }
}
