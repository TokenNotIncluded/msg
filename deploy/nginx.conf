# Install inside an existing nginx http {} configuration. Set your own hostname
# and TLS certificate before exposing this listener to the Internet.
server {
    listen 443 ssl;
    server_name msg.example.org;
    ssl_certificate /etc/letsencrypt/live/msg.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/msg.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    large_client_header_buffers 4 16k;
    # A path-GET run URL can carry credentials. Never record it in access logs.
    access_log off;
    # Avoid proxy error logs containing complete request URLs as well.
    error_log /dev/null crit;
    location / {
        proxy_pass http://127.0.0.1:8042;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 65s;
        add_header Referrer-Policy no-referrer always;
    }
}
