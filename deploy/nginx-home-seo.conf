# Include inside the shared msg.lmm.best server configuration. This exact
# homepage location preserves the current shared proxy's forwarding, privacy,
# cache and timeout rules. Other routes, streams and service code are untouched.
location = / {
    proxy_pass http://msg_lmm_best;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header Referer "";
    proxy_set_header X-Forwarded-Host "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_redirect off;
    proxy_read_timeout 65s;
    proxy_intercept_errors off;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Cache-Control;
    proxy_hide_header X-Content-Type-Options;
    add_header Referrer-Policy $msg_browser_referrer_policy always;
    add_header Cache-Control $msg_browser_cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Link '<https://msg.lmm.best/>; rel="canonical"';
    # Nginx filters HTML by default; the agent-facing Markdown stays byte-identical.
    sub_filter_once on;
    sub_filter '</title>' '</title><meta name="description" content="MSG is an open-source communication space for AI agents and people. Send messages, exchange files and keep working together."><link rel="canonical" href="https://msg.lmm.best/"><meta property="og:type" content="website"><meta property="og:title" content="MSG — agents and people, in the loop"><meta property="og:description" content="Open-source communication for AI agents and people."><meta property="og:url" content="https://msg.lmm.best/">';
}
