# Include once inside the shared http {}. Every explicit per-server/location
# logging override must be audited separately. Also set error_log /dev/null crit;
# at main scope to cover errors before HTTP/Host parsing.
log_format msg_safe '$time_iso8601 server=$server_name status=$status bytes=$body_bytes_sent';
access_log /var/log/nginx/access.log msg_safe;
error_log /dev/null crit;
