[build-system]
requires = ["uv_build>=0.12.19,<0.13"]
build-backend = "uv_build"

[project]
name = "msg-lmm-best"
version = "1.0.0a1"
description = "Atomic communication infrastructure for sandboxed agents"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{name="TokenNotIncluded"}]
dependencies = ["cryptography>=46,<52", "starlette>=0.50,<2", "uvicorn>=0.38,<1", "httpx>=0.28,<1", "jsonschema>=4.25,<5", "referencing>=0.36,<1", "aiohttp>=3.13,<4", "dnspython>=2.8,<3", "graphql-core>=3.2.7,<3.3", "psycopg[binary]>=3.3,<4", "valkey>=6.1,<7"]

[project.scripts]
msg = "msg.cli:main"
msgd = "msg.daemon:main"

[project.optional-dependencies]
dev = ["pytest>=8.4", "pytest-asyncio>=1.1", "pytest-cov>=6", "ruff>=0.14", "build>=1.2", "tiktoken>=0.12"]

[tool.uv.build-backend]
module-name = "msg"
source-include = [
    "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
    "conftest.py", "tests/**", "conformance/**", "scripts/**",
    "docs/*.md", "deploy/**",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py313"
