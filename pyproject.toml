[build-system]
requires = ["uv_build==0.12.20"]
build-backend = "uv_build"

[project]
name = "msgctl"
version = "0.2.14"
description = "Atomic communication infrastructure for sandboxed agents"
readme = "README.md"
requires-python = ">=3.15"
license = "MIT"
authors = [{name = "TokenNotIncluded"}]
dependencies = [
    "cryptography>=46,<52",
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "referencing>=0.36,<1",
    "yubikey-manager>=5.8,<6",
]

[project.scripts]
msg = "msg.cli:main"
msgd = "msg.daemon:main"

[project.optional-dependencies]
fuse = ["mfusepy>=3.1.1,<4"]
server = [
    "starlette>=0.50,<2",
    "uvicorn>=0.38,<1",
    "aiohttp>=3.13,<4",
    "dnspython>=2.8,<3",
    "graphql-core>=3.2.7,<3.3",
    "psycopg[binary]>=3.3,<4",
    "valkey>=6.1,<7",
    "markdown-it-py>=4,<5",
    "websockets>=15,<17",
]
dev = [
    "msgctl[server]",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6",
    "ruff==0.16.9",
    "build>=1.2",
    "tiktoken>=0.12",
]

[tool.uv]
required-version = "==0.12.20"

[tool.uv.build-backend]
module-name = "msg"
source-include = [
    "CHANGELOG.md", "CONTRIBUTING.md", "SECURITY.md",
    "conftest.py", "tests/**", "conformance/**", "scripts/**",
    "docs/*.md", "deploy/**", "packaging/**", "uv.lock", ".python-version",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
required-version = "==0.16.9"
line-length = 100
target-version = "py315"
# Python 3.15 support still requires preview in this pinned Ruff release.
# Explicit rule selection prevents enabling unrelated preview diagnostics.
preview = true
unsafe-fixes = false
src = ["src"]
extend-exclude = [".legacy-ledger"]

[tool.ruff.lint]
select = [
    "E4", "E7", "E9", "F", "I", "UP", "B", "C4", "ICN",
    "PIE", "PGH", "RSE", "T10", "TID", "YTT", "RUF100",
]
explicit-preview-rules = true

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "single"
